# deploy-workload.yml — Deploy plaz workload infrastructure
#
# Phase 5 of the workflow/image architecture refactor.
# See docs/architecture-refactor.md for design decisions D1–D5.
#
# Replaces deploy-infra.yml. Key differences:
#   - No stage-image job: images are produced by image-bake.yml
#   - Consumes newest gallery image version tagged blessed=true
#   - No run-command bootstrap: Comin is baked into the image (D2)
#   - No SSH ingress from runner needed in steady state
#   - Agenix host key delivered via cloud-init customData (D2 Option A):
#       CI generates ssh_host_ed25519_key → private key to Key Vault →
#       public key to secrets.nix → customData on az vm create →
#       cloud-init writes key at first boot → Comin + agenix work from boot 0

name: deploy-workload

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-workload.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy. Leave as "all" to deploy every enabled region in infra/regions.json. Specify a single env (e.g. plaz, plaz-sea, plaz-jpe) to deploy just that one — works even if the region is disabled.'
        required: true
        default: 'all'

permissions:
  id-token: write   # OIDC
  contents: read    # checkout; secrets push uses explicit GH_PAT

env:
  PROJECT_NAME: plaz

# Workflow-level concurrency is intentionally absent. Per-environment
# serialisation is enforced at the deploy-job level via a matrix-aware
# `concurrency.group: workload-${{ matrix.env }}` (see below). This lets
# distinct regions queue independently while still preventing two runs
# from racing on the same region's host-key rotation + secrets push.

jobs:
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workload template
        run: |
          set -euxo pipefail
          az bicep build --file infra/workload.bicep

  # ── Discover which regions to deploy ───────────────────────────────
  # Reads infra/regions.json and emits a JSON array suitable for use as a
  # matrix include. Push/auto runs deploy every enabled region. A
  # workflow_dispatch with environment=<env> narrows to a single region
  # (even if disabled — escape hatch for paused regions).
  discover:
    name: Discover regions
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.regions.outputs.matrix }}
      count: ${{ steps.regions.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve target regions from infra/regions.json
        id: regions
        env:
          REQUESTED_ENV: ${{ github.event.inputs.environment || 'all' }}
        run: |
          set -euo pipefail
          if [ ! -f infra/regions.json ]; then
            echo "::error::infra/regions.json is missing"
            exit 1
          fi

          if [ "$REQUESTED_ENV" = "all" ]; then
            MATRIX=$(jq -c '[.regions[] | select(.enabled == true) | {env, location, gateway, regionCode}]' infra/regions.json)
          else
            MATRIX=$(jq -c --arg env "$REQUESTED_ENV" '[.regions[] | select(.env == $env) | {env, location, gateway, regionCode}]' infra/regions.json)
            COUNT=$(echo "$MATRIX" | jq 'length')
            if [ "$COUNT" -eq 0 ]; then
              echo "::error::Requested environment '$REQUESTED_ENV' not found in infra/regions.json"
              exit 1
            fi
          fi

          COUNT=$(echo "$MATRIX" | jq 'length')
          echo "Selected $COUNT region(s):"
          echo "$MATRIX" | jq -r '.[] | "  - \(.env) (\(.location), \(.gateway))"'
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT"   >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy (${{ matrix.env }})
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      # Serialise across regions: each leg rotates the agenix host key for
      # its gateway and pushes re-encrypted secrets back to main. Running
      # legs concurrently would race on `git push` (and double-rotate
      # secrets.nix). One region at a time is the safe and simple choice;
      # bake/global is the slow phase, not this workflow.
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    # Per-environment queue: same env serialises (no cancel-in-progress —
    # cancelling mid-flight would leave repo / Key Vault / VM inconsistent).
    concurrency:
      group: workload-${{ matrix.env }}
      cancel-in-progress: false
    env:
      # Matrix values exposed as conventional env vars for downstream steps
      # (most pre-existing scripts read $ENV_NAME / $GATEWAY_NAME / etc.).
      ENV_NAME: ${{ matrix.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve environment parameters
        run: |
          set -euo pipefail
          # All region-specific values come from the matrix entry, which is
          # sourced from infra/regions.json. The Compute Gallery and project
          # Key Vault are project-wide (region-pinned) and consumed from the
          # `global-${PROJECT_NAME}` subscription deployment outputs.
          {
            echo "DEPLOYMENT_LOCATION=${{ matrix.location }}"
            echo "GATEWAY_NAME=${{ matrix.gateway }}"
            echo "REGION_CODE=${{ matrix.regionCode }}"
            echo "GLOBAL_DEPLOYMENT=global-${{ env.PROJECT_NAME }}"
            echo "LANDING_ZONE_DEPLOYMENT=landing-zone-${{ matrix.env }}"
            echo "WORKLOAD_DEPLOYMENT=deploy-${{ matrix.env }}"
          } >> "$GITHUB_ENV"
          echo "ENV_NAME=${{ matrix.env }}  LOCATION=${{ matrix.location }}  GATEWAY=${{ matrix.gateway }}  REGION=${{ matrix.regionCode }}"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve landing-zone outputs
        run: |
          set -euo pipefail
          SUBNET_ID=$(az deployment sub show \
            --name "$LANDING_ZONE_DEPLOYMENT" \
            --query 'properties.outputs.gatewaySubnetId.value' -o tsv 2>/dev/null || true)
          LOG_WS_ID=$(az deployment sub show \
            --name "$LANDING_ZONE_DEPLOYMENT" \
            --query 'properties.outputs.logAnalyticsWorkspaceId.value' -o tsv 2>/dev/null || true)

          if [ -z "$SUBNET_ID" ] || [ -z "$LOG_WS_ID" ]; then
            echo "::error::Could not resolve landing-zone outputs (subnetId or logAnalyticsWorkspaceId). Run the landing-zone workflow first."
            exit 1
          fi

          echo "SUBNET_ID=$SUBNET_ID"                     >> "$GITHUB_ENV"
          echo "LOG_ANALYTICS_WORKSPACE_ID=$LOG_WS_ID"   >> "$GITHUB_ENV"
          echo "Subnet ID:     $SUBNET_ID"
          echo "Log workspace: $LOG_WS_ID"

      # ── Resolve newest blessed gallery image version ───────────────────
      - name: Resolve blessed image version
        id: resolve-image
        run: |
          set -euo pipefail

          GALLERY_RG=$(az deployment sub show \
            --name "${GLOBAL_DEPLOYMENT}" \
            --query 'properties.outputs.galleryResourceGroup.value' -o tsv)
          GALLERY_NAME=$(az deployment sub show \
            --name "${GLOBAL_DEPLOYMENT}" \
            --query 'properties.outputs.galleryName.value' -o tsv)
          IMAGE_DEF=$(az deployment sub show \
            --name "${GLOBAL_DEPLOYMENT}" \
            --query 'properties.outputs.imageDefinitionName.value' -o tsv)

          # List all versions, filter to blessed=true, pick the newest by publishedDate
          BLESSED_ID=$(az sig image-version list \
            --resource-group "$GALLERY_RG" \
            --gallery-name "$GALLERY_NAME" \
            --gallery-image-definition "$IMAGE_DEF" \
            --query "[?tags.blessed=='true'] | sort_by(@, &publishingProfile.publishedDate) | [-1].id" \
            -o tsv)

          if [ -z "$BLESSED_ID" ]; then
            echo "::error::No blessed gallery image version found. Run image-bake workflow first."
            exit 1
          fi

          BLESSED_VERSION=$(az sig image-version show \
            --ids "$BLESSED_ID" \
            --query name -o tsv)

          echo "Blessed image version: $BLESSED_VERSION"
          echo "Blessed image ID:      $BLESSED_ID"
          echo "NIXOS_IMAGE_ID=$BLESSED_ID"       >> "$GITHUB_ENV"
          echo "BLESSED_VERSION=$BLESSED_VERSION"  >> "$GITHUB_ENV"

      # ── Check VM state ────────────────────────────────────────────────
      - name: Check VM state
        id: vm-state
        run: |
          set -euo pipefail

          VM_NAME="vm-${{ env.PROJECT_NAME }}-${GATEWAY_NAME}-${DEPLOYMENT_LOCATION}"
          RG="rg-${{ env.PROJECT_NAME }}-compute-${DEPLOYMENT_LOCATION}"

          # Capture stdout and stderr separately. Mixing them risks a stray
          # az-CLI warning on stderr being concatenated to the image-id and
          # producing a spurious image_changed=true (forcing VM recreation).
          STDERR_FILE=$(mktemp)
          VM_IMAGE_ID=""
          VM_SHOW_EXIT=0
          VM_IMAGE_ID=$(az vm show \
            --resource-group "$RG" --name "$VM_NAME" \
            --query 'storageProfile.imageReference.id' -o tsv 2>"$STDERR_FILE") || VM_SHOW_EXIT=$?
          VM_SHOW_STDERR=$(cat "$STDERR_FILE")
          rm -f "$STDERR_FILE"
          if [ -n "$VM_SHOW_STDERR" ]; then
            echo "az vm show stderr: $VM_SHOW_STDERR"
          fi

          if [ $VM_SHOW_EXIT -ne 0 ]; then
            if echo "$VM_SHOW_STDERR" | grep -qi "could not be found\|ResourceNotFound"; then
              echo "vm_exists=false"   >> "$GITHUB_OUTPUT"
              echo "image_changed=true" >> "$GITHUB_OUTPUT"
              echo "VM does not exist — will be created"
              exit 0
            else
              echo "::error::Unexpected error querying VM: $VM_SHOW_STDERR"
              exit 1
            fi
          fi

          echo "vm_exists=true" >> "$GITHUB_OUTPUT"
          if [ "$VM_IMAGE_ID" = "$NIXOS_IMAGE_ID" ]; then
            echo "image_changed=false" >> "$GITHUB_OUTPUT"
            echo "VM already uses blessed image — no recreation needed"
          else
            echo "image_changed=true" >> "$GITHUB_OUTPUT"
            echo "Image changed — VM will be recreated"
            echo "  current: $VM_IMAGE_ID"
            echo "  target:  $NIXOS_IMAGE_ID"
          fi

      # ── Delete VM + OS disk if image changed ──────────────────────────
      - name: Delete VM if image changed
        if: steps.vm-state.outputs.image_changed == 'true' && steps.vm-state.outputs.vm_exists == 'true'
        run: |
          set -euo pipefail
          VM_NAME="vm-${{ env.PROJECT_NAME }}-${GATEWAY_NAME}-${DEPLOYMENT_LOCATION}"
          RG="rg-${{ env.PROJECT_NAME }}-compute-${DEPLOYMENT_LOCATION}"
          OS_DISK="osdisk-${{ env.PROJECT_NAME }}-${GATEWAY_NAME}-${DEPLOYMENT_LOCATION}"

          # --force-deletion bypasses soft-delete for the VM itself; the OS disk
          # is deleted explicitly on the next line. NIC and public IP are left
          # intact for Bicep to reuse (idempotent re-create on next deploy).
          az vm delete --resource-group "$RG" --name "$VM_NAME" \
            --force-deletion yes --yes
          az disk delete --resource-group "$RG" --name "$OS_DISK" --yes

      # ── Option A: generate agenix host key + customData payload ──────
      # Only when VM is new or image changed (i.e. new VM will be created).
      # Skipped for re-runs against an existing VM with the same image.
      - name: Generate agenix host key and customData (Option A)
        id: hostkey
        if: steps.vm-state.outputs.image_changed == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$GH_PAT"

          # ── Generate ed25519 host key pair ────────────────────────────
          KEY_DIR=$(mktemp -d)
          chmod 700 "$KEY_DIR"
          ssh-keygen -t ed25519 -N '' \
            -C "${GATEWAY_NAME}-host-key" \
            -f "$KEY_DIR/ssh_host_ed25519_key" >/dev/null

          PRIVKEY=$(cat "$KEY_DIR/ssh_host_ed25519_key")
          PUBKEY=$(cat  "$KEY_DIR/ssh_host_ed25519_key.pub")

          # ── Store private key in Key Vault ────────────────────────────
          # The project Key Vault is region-pinned to the primary region
          # (managed by global.yml). All regional workloads share it; the
          # secret name is per-gateway, so collisions are impossible.
          KV_NAME=$(az deployment sub show \
            --name "${GLOBAL_DEPLOYMENT}" \
            --query 'properties.outputs.keyVaultName.value' -o tsv)
          if [ -z "$KV_NAME" ]; then
            echo "::error::Could not resolve Key Vault name from ${GLOBAL_DEPLOYMENT}. Run the global workflow first."
            exit 1
          fi
          az keyvault secret set \
            --vault-name "$KV_NAME" \
            --name "${GATEWAY_NAME}-ssh-host-ed25519-key" \
            --value "$PRIVKEY" \
            --output none
          echo "Private key stored in Key Vault: $KV_NAME / ${GATEWAY_NAME}-ssh-host-ed25519-key"

          # ── Install age + ssh-to-age ──────────────────────────────────
          sudo apt-get update -qq && sudo apt-get install -y -qq age
          go install github.com/Mic92/ssh-to-age/cmd/ssh-to-age@v1.2.0
          export PATH="$HOME/go/bin:$PATH"

          # ── Derive age public key, update secrets.nix, re-encrypt ─────
          VM_AGE_PUBKEY=$(echo "$PUBKEY" | ssh-to-age)
          echo "VM age public key: $VM_AGE_PUBKEY"

          # Read existing host entries from secrets.nix so we preserve other
          # hosts (e.g. when rotating gw2 in Singapore, we must keep gw1's
          # recipient entry intact so it can still decrypt the .age files).
          SECRETS_NIX=nixos/secrets/secrets.nix
          python3 - "$SECRETS_NIX" "$GATEWAY_NAME" "$VM_AGE_PUBKEY" <<'PY' > "${SECRETS_NIX}.new"
          import re, sys
          path, gw_name, new_key = sys.argv[1], sys.argv[2], sys.argv[3]
          keys = {}
          try:
              with open(path) as f:
                  for line in f:
                      m = re.match(r'\s*([a-zA-Z][a-zA-Z0-9_-]*)\s*=\s*"(age1[a-z0-9]+)"\s*;', line)
                      if m:
                          keys[m.group(1)] = m.group(2)
          except FileNotFoundError:
              pass
          keys[gw_name] = new_key
          ordered = sorted(keys.keys())
          print('# secrets.nix — Agenix recipients list')
          print('#')
          print('# AUTO-POPULATED by deploy-workload.yml (Phase 5, Option A).')
          print('# Host keys are generated in CI, stored in Key Vault, injected')
          print('# via cloud-init customData on VM creation.')
          print('# Do not edit key values manually.')
          print('#')
          print('let')
          print('  # ── VM host keys ────────────────────────────────────────────────')
          for name in ordered:
              print(f'  {name} = "{keys[name]}";')
          print('')
          print(f'  allSystems = [ {" ".join(ordered)} ];')
          print('in')
          print('{')
          print('  "comin-github-token.age".publicKeys = allSystems;')
          print('  "tailscale-authkey.age".publicKeys = allSystems;')
          print('}')
          PY
          mv "${SECRETS_NIX}.new" "$SECRETS_NIX"

          # Collect all current recipients for re-encryption. comin-github-token.age
          # gets re-encrypted to every host in allSystems so any host can decrypt.
          ALL_RECIPIENTS=$(grep -oE 'age1[a-z0-9]+' "$SECRETS_NIX" | sort -u)
          AGE_R_FLAGS=""
          for k in $ALL_RECIPIENTS; do
            AGE_R_FLAGS="$AGE_R_FLAGS -r $k"
          done

          # Re-encrypt comin-github-token.age for ALL current recipients.
          # shellcheck disable=SC2086
          printf '%s' "$GH_PAT" | age $AGE_R_FLAGS -a \
            > nixos/secrets/comin-github-token.age

          # tailscale-authkey.age — only write a placeholder if it doesn't
          # already exist. Otherwise the existing operator-managed encrypted
          # blob is left intact (other hosts retain access). The new host
          # will not be able to decrypt this secret until the operator
          # re-encrypts with `agenix -e nixos/secrets/tailscale-authkey.age`.
          if [ ! -s nixos/secrets/tailscale-authkey.age ]; then
            echo "::warning::tailscale-authkey.age did not exist — writing placeholder. Re-encrypt with real Tailscale key after deploy."
            # shellcheck disable=SC2086
            printf 'PLACEHOLDER_REPLACE_WITH_REAL_KEY' \
              | age $AGE_R_FLAGS -a > nixos/secrets/tailscale-authkey.age
          else
            echo "::warning::tailscale-authkey.age left unchanged. ${GATEWAY_NAME} cannot decrypt it until operator re-encrypts with all current recipients."
          fi

          # ── Commit secrets back to main ───────────────────────────────
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nixos/secrets/

          if git diff --cached --quiet; then
            echo "No secrets changes to commit"
          else
            git commit -m "chore: rotate agenix host key for ${GATEWAY_NAME} (Option A) [skip ci]"
            git push \
              "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git" \
              HEAD:main
            echo "✅ Secrets committed"
          fi

          # ── Build cloud-init customData payload ───────────────────────
          # Indentation inside the YAML content block matters for cloud-init.
          # The private key lines are indented 6 spaces under `content: |`.
          # Indent private key lines by 6 spaces to sit correctly under
          # the YAML `content: |` block (2-space list indent + 4-space key indent).
          #
          # NB: each heredoc body line below is "<10 spaces><tab><content>".
          # The 10 spaces satisfy this `run: |` YAML block scalar's indent
          # (without them YAML treats the dedented line as the block's end
          # and the workflow file fails to parse). The tab is then stripped
          # by `<<-CLOUDINIT` (POSIX `<<-` only strips leading TABS, not
          # spaces) so the rendered cloud-init document starts at column 0.
          PRIVKEY_INDENTED=$(echo "$PRIVKEY" | sed 's/^/      /')
          CLOUD_INIT=$(cat <<-CLOUDINIT
          	#cloud-config
          	write_files:
          	  - path: /etc/ssh/ssh_host_ed25519_key
          	    permissions: '0600'
          	    owner: root:root
          	    content: |
          	$PRIVKEY_INDENTED
          	  - path: /etc/ssh/ssh_host_ed25519_key.pub
          	    permissions: '0644'
          	    owner: root:root
          	    content: |
          	      $PUBKEY
          	  - path: /etc/comin-bootstrap-token
          	    permissions: '0400'
          	    owner: root:root
          	    content: |
          	      $GH_PAT
          	CLOUDINIT
          )

          CUSTOM_DATA_B64=$(printf '%s' "$CLOUD_INIT" | base64 -w 0)
          # Mask the payload before exporting: it contains the host private
          # key and must never appear in Actions logs (e.g. via `set -x`).
          echo "::add-mask::$CUSTOM_DATA_B64"
          echo "CUSTOM_DATA_B64=$CUSTOM_DATA_B64" >> "$GITHUB_ENV"

          # Export key material for run-command delivery step (belt-and-suspenders
          # against cloud-init write_files being silently skipped on NixOS images
          # that predate the cloud_config_modules fix).
          PRIVKEY_B64=$(printf '%s' "$PRIVKEY" | base64 -w 0)
          PUBKEY_B64=$(printf '%s' "$PUBKEY" | base64 -w 0)
          echo "::add-mask::$PRIVKEY_B64"
          echo "HOSTKEY_PRIV_B64=$PRIVKEY_B64" >> "$GITHUB_ENV"
          echo "HOSTKEY_PUB_B64=$PUBKEY_B64"  >> "$GITHUB_ENV"

          # Cleanup key material from runner disk
          rm -rf "$KEY_DIR"
          echo "hostkey_generated=true" >> "$GITHUB_OUTPUT"

      # ── Deploy Infrastructure ─────────────────────────────────────────
      - name: Deploy Infrastructure
        env:
          ADMIN_SSH_PUBLIC_KEY: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}
        run: |
          set -euxo pipefail
          if ! az deployment sub create \
            --location "${DEPLOYMENT_LOCATION}" \
            --template-file infra/workload.bicep \
            --parameters "infra/environments/${ENV_NAME}-workload.bicepparam" \
            --name "${WORKLOAD_DEPLOYMENT}"; then
            echo "::error::Bicep deployment failed. Fetching error details..."
            az deployment sub show \
              --name "${WORKLOAD_DEPLOYMENT}" \
              --query 'properties.error' -o json || true
            az deployment operation sub list \
              --name "${WORKLOAD_DEPLOYMENT}" \
              --query "[?properties.statusCode != 'OK'].{resource: properties.targetResource.resourceName, status: properties.statusCode, message: properties.statusMessage.error.message}" \
              -o table || true
            exit 1
          fi

      - name: Show Outputs
        run: |
          set -euxo pipefail
          az deployment sub show \
            --name "${WORKLOAD_DEPLOYMENT}" \
            --query properties.outputs \
            --output table

      - name: Wait for waagent ready
        if: steps.vm-state.outputs.image_changed == 'true'
        run: |
          set -euo pipefail
          MAX_ATTEMPTS=30
          POLL_INTERVAL=10
          VM_NAME="vm-${{ env.PROJECT_NAME }}-${GATEWAY_NAME}-${DEPLOYMENT_LOCATION}"
          RG="rg-${{ env.PROJECT_NAME }}-compute-${DEPLOYMENT_LOCATION}"
          display="unknown"
          for i in $(seq 1 $MAX_ATTEMPTS); do
            agent_status=$(az vm get-instance-view \
              --resource-group "$RG" --name "$VM_NAME" \
              --query 'instanceView.vmAgent' -o json 2>/dev/null || echo '{}')
            if [ -z "$agent_status" ] || [ "$agent_status" = "null" ]; then
              agent_status='{}'
            fi
            display=$(echo "$agent_status"   | jq -r '(.statuses[0].displayStatus // "unknown")')
            message=$(echo "$agent_status"   | jq -r '(.statuses[0].message       // "unknown")')
            version=$(echo "$agent_status"   | jq -r '(.vmAgentVersion            // "unknown")')
            heartbeat=$(echo "$agent_status" | jq -r '(.statuses[0].time          // "unknown")')
            echo "attempt $i: status=$display version=$version message=$message heartbeat=$heartbeat"
            [ "$display" = "Ready" ] && { echo "waagent is ready"; break; }
            sleep $POLL_INTERVAL
          done
          [ "$display" != "Ready" ] && {
            TIMEOUT_MIN=$(( MAX_ATTEMPTS * POLL_INTERVAL / 60 ))
            echo "::error::waagent did not become ready after $MAX_ATTEMPTS attempts (~${TIMEOUT_MIN} min)"
            exit 1
          } || true

      - name: Write host key and bootstrap token via run-command
        if: steps.vm-state.outputs.image_changed == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          HOSTKEY_PRIV_B64: ${{ env.HOSTKEY_PRIV_B64 }}
          HOSTKEY_PUB_B64: ${{ env.HOSTKEY_PUB_B64 }}
        run: |
          set -euo pipefail
          echo "::add-mask::$GH_PAT"
          echo "::add-mask::$HOSTKEY_PRIV_B64"

          VM_NAME="vm-${{ env.PROJECT_NAME }}-${GATEWAY_NAME}-${DEPLOYMENT_LOCATION}"
          RG="rg-${{ env.PROJECT_NAME }}-compute-${DEPLOYMENT_LOCATION}"
          TOKEN_B64=$(printf '%s' "$GH_PAT" | base64 -w 0)
          echo "::add-mask::$TOKEN_B64"

          az vm run-command invoke \
            --resource-group "$RG" --name "$VM_NAME" \
            --command-id RunShellScript \
            --scripts "
              export PATH=/run/current-system/sw/bin:/run/current-system/sw/sbin:\$PATH
              set -euo pipefail

              # Write SSH host private key
              printf '%s' '$HOSTKEY_PRIV_B64' | base64 -d \
                | install -m 0600 -o root -g root /dev/stdin /etc/ssh/ssh_host_ed25519_key

              # Write SSH host public key
              printf '%s' '$HOSTKEY_PUB_B64' | base64 -d \
                | install -m 0644 -o root -g root /dev/stdin /etc/ssh/ssh_host_ed25519_key.pub

              # Write Comin bootstrap token
              printf '%s' '$TOKEN_B64' | base64 -d \
                | install -m 0400 -o root -g root /dev/stdin /etc/comin-bootstrap-token

              # Restart sshd so it picks up the new host key
              if ! systemctl restart sshd; then
                echo '::warning::sshd restart failed (non-fatal); host key will be picked up on next sshd restart'
              fi

              # Restart comin so it picks up the bootstrap token
              systemctl reset-failed comin.service || true
              systemctl restart comin.service

              echo 'Host key and bootstrap token written; sshd and comin restarted'
            "
          echo "✅ Host key and bootstrap token delivered via run-command"

      - name: Job summary
        if: always()
        run: |
          {
            echo "### deploy-workload summary"
            echo
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Blessed image | \`${BLESSED_VERSION:-n/a}\` |"
            echo "| Image changed | \`${{ steps.vm-state.outputs.image_changed }}\` |"
            echo "| Host key generated | \`${{ steps.hostkey.outputs.hostkey_generated || 'false' }}\` |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
