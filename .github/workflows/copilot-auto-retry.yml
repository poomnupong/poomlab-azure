# Copilot Auto-Retry on CI Failure
#
# When a CI workflow fails on a Copilot-created branch (copilot/**), or on main
# for post-merge workflows (landing-zone, deploy-workload), this workflow
# automatically creates a new GitHub Issue assigned to Copilot that contains the
# failure details and instructions to fix, closing the feedback loop without
# human intervention.
#
# Guardrails:
#   - Maximum 5 auto-retry issues per branch to prevent infinite loops.
#   - Issues are labelled `copilot-auto-retry` for easy filtering.
#   - Failure logs (last 200 lines) and failed job names are embedded in the body.
#   - Concurrency group per branch serializes concurrent failure events to avoid
#     duplicate issues from two simultaneous failures on the same branch.
#   - Restricted to same-repository runs to prevent fork-branch abuse.
#
# Watched workflows:
#   ci-pr, image-bake      — run on PR branches (copilot/**)
#   landing-zone, deploy-workload — run on main after merge

name: Copilot Auto-Retry on CI Failure

on:
  workflow_run:
    workflows:
      - "ci-pr"
      - "image-bake"
      - "landing-zone"
      - "deploy-workload"
    types: [completed]
    # No branches filter here — filtering is done in the job condition so that:
    #   - ci-pr / image-bake  → copilot/** branches (PR context)
    #   - landing-zone / deploy-workload → main branch (post-merge context)

permissions:
  issues: write    # create and label issues
  actions: read    # read workflow run logs
  contents: read

# Serialize per-branch so that two simultaneous failure events don't both
# read count=0 and each create a duplicate "[Auto-Retry 1/5]" issue.
concurrency:
  group: copilot-auto-retry-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false   # queue, never cancel

jobs:
  auto-retry:
    # Only act on failures from:
    #   - copilot/** branches (Copilot PR work), OR
    #   - main branch (post-merge failures for landing-zone / deploy-workload)
    # AND only from the same repository — not from fork PRs whose branch
    # happens to be named copilot/... (fork runs have a different repo id).
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository_id == github.repository_id &&
      (
        startsWith(github.event.workflow_run.head_branch, 'copilot/') ||
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------------
      # 1. Ensure the tracking label exists (idempotent).
      # ----------------------------------------------------------------
      - name: Ensure copilot-auto-retry label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "copilot-auto-retry" \
            --repo "${{ github.repository }}" \
            --description "Auto-created issue for Copilot CI failure retry" \
            --color "e11d48" \
            2>/dev/null || true

      # ----------------------------------------------------------------
      # 2. Count how many auto-retry issues already exist for this branch.
      #    If we've hit the cap, print a warning and stop.
      # ----------------------------------------------------------------
      - name: Count existing retry issues for this branch
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          # Use exact matching against the title suffix " on `<branch>`" to avoid
          # false positives when one branch name is a prefix of another (e.g.
          # copilot/fix vs copilot/fix-v2). A backtick literal is stored in BT
          # to avoid bash command-substitution of raw backticks.
          BT='`'
          SEARCH=" on ${BT}${BRANCH}${BT}"
          # --limit 1000 so count is accurate even if many issues exist.
          # Use `|| echo "0"` so COUNT is never empty if gh fails;
          # then validate it's a plain integer and default to 0 if not.
          RAW=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label "copilot-auto-retry" \
            --state all \
            --limit 1000 \
            --json title \
            --jq '.[].title' 2>/dev/null | \
            grep -cF "$SEARCH" || echo "0")
          if [[ "${RAW}" =~ ^[0-9]+$ ]]; then
            COUNT="${RAW}"
          else
            echo "::warning::Could not fetch retry count (got '${RAW}'); defaulting to 0"
            COUNT=0
          fi
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "Auto-retry issues for '${BRANCH}': ${COUNT}"
          if [ "${COUNT}" -ge 5 ]; then
            echo "::warning::Max retries (5) reached for '${BRANCH}'. No new issue will be created."
          fi

      # ----------------------------------------------------------------
      # 3. Collect failure logs (last 200 lines) with a safe random delimiter
      #    so a line "LOGEOF" in log output can never truncate the value.
      # ----------------------------------------------------------------
      - name: Collect failure logs
        if: fromJSON(steps.check.outputs.count) < 5
        id: logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          LOGS=$(gh run view "${{ github.event.workflow_run.id }}" \
            --repo "${{ github.repository }}" \
            --log-failed 2>&1 | tail -200)
          set -e
          # Use a random hex boundary that cannot appear in log output.
          DELIMITER="LOGS_$(openssl rand -hex 16)"
          {
            echo "logs<<${DELIMITER}"
            echo "$LOGS"
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------
      # 4. Find the open PR for this branch (may not exist for push runs).
      # ----------------------------------------------------------------
      - name: Find associated pull request
        if: fromJSON(steps.check.outputs.count) < 5
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          PR_NUM=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          echo "number=${PR_NUM}" >> "$GITHUB_OUTPUT"
          if [ -n "$PR_NUM" ]; then
            echo "Associated PR: #${PR_NUM}"
          else
            echo "No open PR found for branch '${BRANCH}'"
          fi

      # ----------------------------------------------------------------
      # 5. Create the retry issue assigned to Copilot.
      #    Uses the Jobs API to list which specific jobs failed so the agent
      #    doesn't have to open the run manually to find the failure point.
      # ----------------------------------------------------------------
      - name: Create retry issue
        if: fromJSON(steps.check.outputs.count) < 5
        uses: actions/github-script@v7
        env:
          FAILURE_LOGS: ${{ steps.logs.outputs.logs }}
        with:
          script: |
            const run = context.payload.workflow_run;
            const branch = run.head_branch;
            const retryNum = parseInt('${{ steps.check.outputs.count }}') + 1;
            const prNum = '${{ steps.pr.outputs.number }}';
            const logs = (process.env.FAILURE_LOGS || '(log collection unavailable)').trim();

            // Fetch the individual jobs for this run and identify which failed.
            let failedJobLines = '(could not retrieve job details)';
            try {
              const jobsResp = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                filter: 'latest',
                per_page: 100,
              });
              const failedJobs = jobsResp.data.jobs.filter(j => j.conclusion === 'failure');
              if (failedJobs.length > 0) {
                failedJobLines = failedJobs
                  .map(j => `- **${j.name}** — [View logs](${j.html_url})`)
                  .join('\n');
              } else {
                failedJobLines = '(no individual jobs marked as failed — check the run link)';
              }
            } catch (err) {
              core.warning(`Could not fetch jobs for run ${run.id}: ${err.message}`);
            }

            const prLink  = prNum ? `- **Pull Request:** #${prNum}` : `- **Branch:** \`${branch}\``;
            const fixTarget = prNum
              ? `the branch for PR #${prNum} (\`${branch}\`)`
              : `the \`${branch}\` branch`;

            const title = `[Auto-Retry ${retryNum}/5] Fix CI failure: ${run.name} on \`${branch}\``;

            const body = [
              `## CI Failure — Auto-Retry Request (${retryNum}/5)`,
              ``,
              `A CI workflow failed. Please investigate the failure and push a fix.`,
              ``,
              `### Failure Details`,
              `- **Workflow:** ${run.name}`,
              `- **Run:** [#${run.run_number}](${run.html_url})`,
              prLink,
              `- **Attempt:** ${retryNum} of 5`,
              ``,
              `### Failed Jobs`,
              ``,
              failedJobLines,
              ``,
              `### Failure Logs`,
              ``,
              `<details>`,
              `<summary>Expand to see failure logs (last 200 lines)</summary>`,
              ``,
              `\`\`\``,
              logs,
              `\`\`\``,
              ``,
              `</details>`,
              ``,
              `### Instructions`,
              ``,
              `1. Review the **Failed Jobs** links above for the specific job output.`,
              `2. Expand the failure logs for additional context.`,
              `3. Fix the issue in ${fixTarget}.`,
              `4. Push the fix and verify that CI passes before closing this issue.`,
              ``,
              `> _This issue was automatically generated by the \`copilot-auto-retry\` workflow._`,
              `> _If the root cause cannot be fixed autonomously, please escalate to a human reviewer._`,
            ].join('\n');

            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['copilot-auto-retry'],
                // 'copilot' is the GitHub bot account for the Copilot coding agent.
                // Assignment succeeds when the Copilot app is enabled on the repository.
                assignees: ['copilot'],
              });
              core.info(`Created retry issue: ${title}`);
            } catch (err) {
              // Fall back to creating without an assignee (e.g. Copilot app not installed,
              // or the 'copilot' user is not a valid assignee for this repo).
              // The `copilot-auto-retry` label and issue title still make it easy to find.
              core.warning(`Could not assign issue to Copilot (${err.message}); creating unassigned.`);
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['copilot-auto-retry'],
              });
              core.info(`Created retry issue (unassigned): ${title}`);
            }
