# Automated Flake Lock Updater
#
# Full flow:
#   1. This workflow runs `nix flake update` inside nixos/ to resolve all inputs
#      to their latest versions and write/refresh nixos/flake.lock.
#   2. peter-evans/create-pull-request opens (or force-pushes) a PR on branch
#      automated/update-flake-lock containing only the changed flake.lock.
#      If there is no diff (lock file already up to date) no PR is created.
#   3. A team member reviews and merges the PR.
#   4. The merge triggers ci-pr.yml (validation gate) on the PR and, once merged
#      to main, triggers deploy-nixos.yml which nudges all affected VMs to run
#      `nixos-rebuild switch` with the updated nixpkgs input.
#
# First run note:
#   nixos/flake.lock does not yet exist in the repo. Running this workflow via
#   workflow_dispatch for the first time will generate that initial lock file and
#   open the bootstrapping PR. Merging that PR unblocks ci-pr.yml and
#   deploy-nixos.yml, both of which currently fail because the lock file is absent.
#
# Required secret — GH_PAT:
#   This workflow uses a Personal Access Token (PAT) stored as the repository
#   secret GH_PAT.  A PAT is required (rather than the built-in GITHUB_TOKEN)
#   because GitHub intentionally suppresses pull_request / push events for
#   activity that originates from GITHUB_TOKEN.  Without a PAT the PR opened
#   by create-pull-request would never trigger ci-pr.yml, blocking the required
#   status checks and making the PR unmergeable.
#
#   How to create GH_PAT (fine-grained PAT — recommended):
#     1. GitHub → Settings → Developer settings → Personal access tokens
#        → Fine-grained tokens → Generate new token
#     2. Set Resource owner to your account (or org owning this repo)
#     3. Under "Repository access" select "Only select repositories"
#        and choose this repository
#     4. Under "Permissions → Repository permissions" grant:
#        • Contents — Read and Write
#        • Pull requests — Read and Write
#     5. Set expiration (e.g. 90 days), then click "Generate token"
#     6. Copy the token value
#     7. In this repository go to Settings → Secrets and variables →
#        Actions → New repository secret
#     8. Name: GH_PAT  |  Value: <paste token>

name: update-flake-lock

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 8 * * 1'   # Every Monday at 08:00 UTC

permissions:
  contents: write       # Required to push the commit with flake.lock
  pull-requests: write  # Required to open / update the PR

jobs:
  update-flake-lock:
    name: Update flake.lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: "experimental-features = nix-command flakes"

      - name: Update flake inputs
        run: cd nixos && nix flake update

      - name: Open / update pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "chore(nixos): update flake.lock"
          title: "chore(nixos): update flake.lock"
          body: |
            ## Automated nixpkgs input bump

            This pull request was opened automatically by the `update-flake-lock`
            workflow. It contains a refreshed `nixos/flake.lock` that pins all
            flake inputs (primarily `nixpkgs`, `comin`, `agenix`) to their latest
            revisions.

            ### What to do

            1. Review the diff — confirm inputs bumped to expected revisions.
            2. Merge this PR.

            ### What happens after merge

            Comin (running on each VM) automatically detects the new commit on
            `main` and runs `nixos-rebuild switch` with the updated flake lock.
            No manual SSH or intervention is required.

            The `comin-status` workflow runs daily and can also be triggered
            manually to verify VMs picked up the update. Commit statuses from
            Comin's `postDeploymentCommand` will appear on this merge commit.
          branch: "automated/update-flake-lock"
          delete-branch: true
          labels: "dependencies,nixos"
