# Comin Fleet Health Check
#
# Checks the deployment status of Comin-managed VMs.
#
# With Comin, VMs pull their own config changes automatically. This workflow
# provides visibility into fleet health via the Actions tab:
#   - Manual dispatch: check status on demand
#   - Daily schedule: automated health monitoring
#   - After deploy-workload: verify VM came up correctly
#
# Required secrets (same OIDC set as other Azure workflows):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID

name: comin-status

on:
  workflow_run:
    workflows: ["deploy-workload"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # Daily at 06:00 UTC

permissions:
  id-token: write   # Required for OIDC
  contents: read

env:
  DEPLOYMENT_LOCATION: southcentralus
  PROJECT_NAME: plaz

jobs:
  # ------------------------------------------------------------------
  # Validate NixOS flake (same check as ci-pr for consistency)
  # ------------------------------------------------------------------
  validate:
    name: Validate NixOS
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check NixOS flake
        run: |
          cd nixos
          if [ ! -f flake.lock ]; then
            echo "error: nixos/flake.lock is missing. Commit the lock file and rerun CI."
            exit 1
          fi
          nix flake check . --no-update-lock-file

  # ------------------------------------------------------------------
  # Discover gateways from infra/regions.json (single source of truth)
  # ------------------------------------------------------------------
  discover:
    name: Discover gateways
    needs: validate
    runs-on: ubuntu-latest
    if: >-
      needs.validate.result == 'success'
    outputs:
      matrix: ${{ steps.regions.outputs.matrix }}
      count: ${{ steps.regions.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve enabled regions
        id: regions
        run: |
          set -euo pipefail
          if [ ! -f infra/regions.json ]; then
            echo "::error::infra/regions.json is missing"
            exit 1
          fi
          MATRIX=$(jq -c '[.regions[] | select(.enabled == true) | {env, location, gateway, regionCode}]' infra/regions.json)
          COUNT=$(echo "$MATRIX" | jq 'length')
          echo "Checking $COUNT gateway(s):"
          echo "$MATRIX" | jq -r '.[] | "  - \(.gateway) (\(.location))"'
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT"   >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # Check Comin status on each VM (matrix over gateways/regions)
  # ------------------------------------------------------------------
  check-gateway:
    name: Check ${{ matrix.gateway }} Comin Status
    needs: discover
    runs-on: ubuntu-latest
    if: needs.discover.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Query Comin status on ${{ matrix.gateway }}
        env:
          RG: rg-${{ env.PROJECT_NAME }}-compute-${{ matrix.location }}
          VM_NAME: vm-${{ env.PROJECT_NAME }}-${{ matrix.gateway }}-${{ matrix.location }}
        run: |
          set -euo pipefail
          # Read-only: stopped/absent gateways remain NOT CHECKED, never healthy.
          # Running gateways require current fetch AND successful activation
          # evidence; an active systemd unit or old profile alone is insufficient.
          python3 .github/scripts/comin-status.py \
            --resource-group "$RG" --vm-name "$VM_NAME" --timeout-seconds 240
