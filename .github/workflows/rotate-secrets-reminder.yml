# Secret Rotation Reminder
#
# Creates a GitHub issue monthly reminding you to rotate secrets
# (GitHub PAT, Tailscale auth key, etc.) before they expire.
# This keeps the rotation prompt in the git/GitHub workflow.

name: rotate-secrets-reminder

on:
  schedule:
    - cron: '0 9 1 * *'   # 1st of every month at 09:00 UTC
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  create-reminder:
    name: Create Rotation Reminder
    runs-on: ubuntu-latest
    steps:
      - name: Create rotation reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🔑 Monthly secret rotation check — ${new Date().toISOString().slice(0, 7)}`;

            // Check if a similar issue already exists this month
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'secret-rotation,automated',
              per_page: 5
            });

            const thisMonth = new Date().toISOString().slice(0, 7);
            const alreadyExists = existingIssues.data.some(i => i.title.includes(thisMonth));
            if (alreadyExists) {
              console.log('Rotation reminder already exists for this month. Skipping.');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              labels: ['secret-rotation', 'automated'],
              body: `## Monthly Secret Rotation Check

            Review the following secrets and rotate any that are near expiry:

            ### GitHub PAT (\`GH_PAT\` repo secret + agenix-encrypted \`comin-github-token.age\`)

            - [ ] Check PAT expiry date in [GitHub → Settings → Developer settings → Fine-grained tokens](https://github.com/settings/tokens?type=beta)
            - [ ] If expiring soon: generate a new PAT with **Contents + Pull requests + Commit statuses** (R/W)
            - [ ] Update the \`GH_PAT\` repository secret: \`gh secret set GH_PAT --body "<new-token>"\`
            - [ ] Update the agenix-encrypted token: \`cd nixos && agenix -e secrets/comin-github-token.age\`
            - [ ] Commit and push the re-encrypted file — Comin picks it up automatically

            ### Tailscale Auth Key (\`tailscale-authkey.age\`)

            - [ ] Check if the Tailscale auth key is still valid in [Tailscale Admin → Settings → Keys](https://login.tailscale.com/admin/settings/keys)
            - [ ] If expired or expiring: generate a new reusable auth key
            - [ ] Update: \`cd nixos && agenix -e secrets/tailscale-authkey.age\`
            - [ ] Commit and push

            ### VM Age Keys (rare — only if VM compromised)

            - [ ] Verify VMs have not been compromised
            - [ ] If a VM was rebuilt: extract new age key and run \`agenix -r\` to re-encrypt all secrets

            ---

            *This issue was created automatically by the \`rotate-secrets-reminder\` workflow.*
            *Close this issue after completing the review.*`
            });
