# image-bake.yml - Bake Comin into the NixOS Azure image and publish
#
# Phase 3 of the workflow/image architecture refactor.
# See docs/architecture-refactor.md for design decisions D1-D5.
#
# Pipeline:
#   nix-installer -> nix build -> locate VHD -> gzip -> upload
# We layer poomlab-azure modules on top of the upstream hardware baseline
# before building. We do NOT use Magic Nix Cache or any other third-party
# build cache; builds still pull from Nix's default substituters
# (cache.nixos.org et al.), but every CI run starts with an empty local
# /nix/store. This trades ~20-25 min of wall-time for zero third-party
# cache dependency and is acceptable given the monthly bake cadence.
#
# Jobs:
#   build   - nix build + Tier 1 nixosTest smoke (always, no Azure cost)
#   publish - upload VHD to gallery + tag tier1=passed (main branch only).
#             blessed=true is intentionally NOT set here - it is reserved
#             for image versions that also pass Tier 2 (Phase 4).

name: image-bake

on:
  schedule:
    # Saturday 14:00 UTC - after nixos-azimage-builder weekly_forge (06:00 UTC)
    - cron: "0 14 * * 6"
  push:
    branches: [main]
    paths:
      - 'nixos/modules/**'
      - 'nixos/flake.nix'
      - 'nixos/flake.lock'
      - 'image-bake/**'
      - '.github/workflows/image-bake.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nixos/modules/**'
      - 'nixos/flake.nix'
      - 'nixos/flake.lock'
      - 'image-bake/**'
      - '.github/workflows/image-bake.yml'
  workflow_dispatch:

permissions:
  id-token: write   # OIDC for Azure login (publish job only)
  contents: read

concurrency:
  group: image-bake
  cancel-in-progress: false   # never cancel a running bake

env:
  DEPLOYMENT_LOCATION: southcentralus
  PROJECT_NAME: plaz

jobs:
  # -----------------------------------------------------------------------
  # Job 1: build - nix build + Tier 1 smoke test
  # Runs on every trigger. No Azure cost. No Azure credentials needed.
  # -----------------------------------------------------------------------
  build:
    name: Build & Tier 1 Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Generate image version string
        id: version
        run: |
          set -euo pipefail
          VERSION="$(date -u +%Y%m%d.%H%M)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Image version: ${VERSION}"

      - name: Build plaz image
        run: |
          cd image-bake
          nix build .#plazImage --print-build-logs

      - name: Locate VHD artifact
        id: locate
        run: |
          set -euo pipefail
          VHD_PATH=$(find image-bake/result/ -name "*.vhd" | head -n 1)
          if [ -z "${VHD_PATH}" ]; then
            echo "::error::No .vhd file found under image-bake/result/"
            exit 1
          fi
          echo "vhd_path=${VHD_PATH}" >> "$GITHUB_OUTPUT"
          echo "Found VHD: ${VHD_PATH} ($(du -sh "${VHD_PATH}" | cut -f1))"

      - name: Tier 1 smoke test (nixosTest in QEMU)
        run: |
          cd image-bake
          # Use a separate out-link so we don't clobber ./result (which points
          # to the VHD output referenced by the locate step's vhd_path output
          # and consumed by the compress step).
          nix build .#checks.x86_64-linux.smokeTest --print-build-logs -o result-smoke
          echo "Tier 1 smoke test passed"

      - name: Compress VHD for upload
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VHD_PATH: ${{ steps.locate.outputs.vhd_path }}
        run: |
          set -euo pipefail
          ASSET="plaz-image-${VERSION}.vhd"
          cp "${VHD_PATH}" "${ASSET}"
          gzip -9 "${ASSET}"
          echo "Compressed: ${ASSET}.gz ($(du -sh "${ASSET}.gz" | cut -f1))"

      - name: Upload VHD artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4.3.0
        with:
          name: plaz-vhd-${{ steps.version.outputs.version }}
          path: "*.vhd.gz"
          retention-days: 3

  # -----------------------------------------------------------------------
  # Job 2: publish - upload VHD to Compute Gallery, tag tier1=passed
  # Runs only on main branch. Requires Azure OIDC.
  # blessed=true is set by Phase 4 (Tier 2 real-Azure smoke), not here.
  # -----------------------------------------------------------------------
  publish:
    name: Publish to Gallery
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    outputs:
      gallery_version: ${{ steps.stage.outputs.gallery_version }}

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Gallery exists
        # The gallery is managed by landing-zone.yml. Read the actual gallery
        # and image-definition names from the landing-zone deployment outputs
        # rather than hard-coding (the bicep names them gal_<project> /
        # nixos-azimage). If either is missing the user must run landing-zone.
        run: |
          set -euxo pipefail
          GALLERY_RG="rg-${{ env.PROJECT_NAME }}-gallery-${{ env.DEPLOYMENT_LOCATION }}"
          GALLERY_NAME=$(az deployment sub show \
            --name "landing-zone-${{ env.PROJECT_NAME }}" \
            --query 'properties.outputs.galleryName.value' -o tsv) || {
            echo "::error::landing-zone deployment not found. Run the landing-zone workflow first."; exit 1;
          }
          IMAGE_DEF=$(az deployment sub show \
            --name "landing-zone-${{ env.PROJECT_NAME }}" \
            --query 'properties.outputs.imageDefinitionName.value' -o tsv) || {
            echo "::error::landing-zone deployment not found. Run the landing-zone workflow first."; exit 1;
          }
          # `az ... -o tsv` exits 0 with empty output when the queried output
          # is missing/null, so guard against that explicitly.
          if [ -z "$GALLERY_NAME" ] || [ -z "$IMAGE_DEF" ]; then
            echo "::error::Could not read galleryName/imageDefinitionName from landing-zone deployment outputs (got GALLERY_NAME='$GALLERY_NAME', IMAGE_DEF='$IMAGE_DEF'). Re-run the landing-zone workflow."
            exit 1
          fi
          az sig image-definition show \
            --resource-group "$GALLERY_RG" \
            --gallery-name "$GALLERY_NAME" \
            --gallery-image-definition "$IMAGE_DEF" \
            -o none \
          || { echo "::error::Gallery image definition '$IMAGE_DEF' not found in $GALLERY_RG/$GALLERY_NAME. Run the landing-zone workflow first."; exit 1; }

      - name: Download VHD artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: plaz-vhd-${{ needs.build.outputs.version }}

      - name: Stage VHD and publish gallery image version
        id: stage
        env:
          VERSION_RAW: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail

          # Convert YYYYMMDD.HHMM -> gallery Major.Minor.Patch
          GALLERY_VERSION="$(echo "$VERSION_RAW" | sed -E 's/^([0-9]{8})\.([0-9]{4})$/\1.\2.0/')"
          if ! echo "$GALLERY_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Could not convert $VERSION_RAW to gallery version format"
            exit 1
          fi
          echo "Gallery version: $GALLERY_VERSION"

          GALLERY_RG="rg-${{ env.PROJECT_NAME }}-gallery-${{ env.DEPLOYMENT_LOCATION }}"
          GALLERY_NAME=$(az deployment sub show \
            --name "landing-zone-${{ env.PROJECT_NAME }}" \
            --query 'properties.outputs.galleryName.value' -o tsv)
          IMAGE_DEF=$(az deployment sub show \
            --name "landing-zone-${{ env.PROJECT_NAME }}" \
            --query 'properties.outputs.imageDefinitionName.value' -o tsv)

          # Idempotent: skip if version already exists
          EXISTING=$(az sig image-version show \
            --resource-group "$GALLERY_RG" \
            --gallery-name "$GALLERY_NAME" \
            --gallery-image-definition "$IMAGE_DEF" \
            --gallery-image-version "$GALLERY_VERSION" \
            --query id -o tsv 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "Gallery image version $GALLERY_VERSION already exists - skipping upload"
            echo "IMAGE_VERSION_ID=$EXISTING" >> "$GITHUB_ENV"
            echo "GALLERY_VERSION=$GALLERY_VERSION" >> "$GITHUB_ENV"
            echo "gallery_version=$GALLERY_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Decompress
          ASSET_GZ=$(find . -name "*.vhd.gz" | head -n 1)
          VHD="${ASSET_GZ%.gz}"
          gunzip "$ASSET_GZ"
          VHD_SIZE=$(stat -c %s "$VHD")
          echo "VHD size: $VHD_SIZE bytes"

          # Direct-upload managed disk
          DISK_NAME="plaz-bake-staging-${GALLERY_VERSION//./-}"
          DISK_ID=$(az disk create \
            --resource-group "$GALLERY_RG" \
            --name "$DISK_NAME" \
            --location "${{ env.DEPLOYMENT_LOCATION }}" \
            --upload-type Upload \
            --upload-size-bytes "$VHD_SIZE" \
            --hyper-v-generation V2 \
            --os-type Linux \
            --query id -o tsv)

          set +x
          SAS=$(az disk grant-access \
            --resource-group "$GALLERY_RG" --name "$DISK_NAME" \
            --access-level Write --duration-in-seconds 3600 \
            --query accessSAS -o tsv)
          echo "::add-mask::$SAS"
          azcopy copy "$VHD" "$SAS" --blob-type PageBlob
          set -x

          az disk revoke-access --resource-group "$GALLERY_RG" --name "$DISK_NAME"

          az rest --method PATCH \
            --url "${DISK_ID}?api-version=2024-03-02" \
            --body '{"properties":{"supportedCapabilities":{"diskControllerTypes":"SCSI, NVMe"}}}'

          IMAGE_VERSION_ID=$(az sig image-version create \
            --resource-group "$GALLERY_RG" \
            --gallery-name "$GALLERY_NAME" \
            --gallery-image-definition "$IMAGE_DEF" \
            --gallery-image-version "$GALLERY_VERSION" \
            --location "${{ env.DEPLOYMENT_LOCATION }}" \
            --os-snapshot "$DISK_ID" \
            --query id -o tsv)

          echo "Waiting for replication..."
          for i in $(seq 1 30); do
            prov=$(az sig image-version show \
              --resource-group "$GALLERY_RG" --gallery-name "$GALLERY_NAME" \
              --gallery-image-definition "$IMAGE_DEF" \
              --gallery-image-version "$GALLERY_VERSION" \
              --query provisioningState -o tsv)
            repl=$(az sig image-version show \
              --resource-group "$GALLERY_RG" --gallery-name "$GALLERY_NAME" \
              --gallery-image-definition "$IMAGE_DEF" \
              --gallery-image-version "$GALLERY_VERSION" \
              --expand ReplicationStatus \
              --query 'replicationStatus.aggregatedState' -o tsv 2>/dev/null || echo "Unknown")
            echo "  attempt $i: prov=$prov repl=$repl"
            [ "$prov" = "Succeeded" ] && [ "$repl" = "Completed" ] && break
            [ "$prov" = "Failed" ] && { echo "::error::Replication failed"; exit 1; }
            sleep 30
          done
          if [ "$prov" != "Succeeded" ] || [ "$repl" != "Completed" ]; then
            echo "::error::Replication timed out"
            exit 1
          fi

          echo "IMAGE_VERSION_ID=$IMAGE_VERSION_ID" >> "$GITHUB_ENV"
          echo "GALLERY_VERSION=$GALLERY_VERSION"   >> "$GITHUB_ENV"
          echo "gallery_version=$GALLERY_VERSION"   >> "$GITHUB_OUTPUT"

          az disk delete --resource-group "$GALLERY_RG" --name "$DISK_NAME" --yes --no-wait

      - name: Tag image version (Tier 1 only)
        # Phase 3 only runs Tier 1 (QEMU nixosTest). The blessed=true tag
        # is reserved for image versions that ALSO pass Tier 2 real-Azure
        # smoke (Phase 4 - see docs/architecture-refactor.md D5). Tagging
        # tier1=passed here keeps `deploy-workload` honest: it must select
        # on blessed=true, not on tier1=passed.
        run: |
          set -euo pipefail
          az tag create \
            --resource-id "$IMAGE_VERSION_ID" \
            --tags tier1=passed \
                   bake-workflow=image-bake \
                   bake-run="${{ github.run_id }}" \
                   bake-sha="${{ github.sha }}"
          echo "Tagged $GALLERY_VERSION as tier1=passed (blessed=true is set by Phase 4)"

      - name: Job summary
        if: always()
        run: |
          {
            echo "### image-bake summary"
            echo
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Gallery version | \`${GALLERY_VERSION:-n/a}\` |"
            echo "| Tier 1 | \`passed\` |"
            echo "| Blessed | \`false\` (set by smoke-tier2 after Tier 2 passes) |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # -----------------------------------------------------------------------
  # Job 3: smoke-tier2 - Tier 2 real-Azure smoke test
  # Runs only on main branch after publish succeeds.
  # Provisions a throwaway VM, asserts Comin is active, tears down, then
  # sets blessed=true on the gallery image version.
  # -----------------------------------------------------------------------
  smoke-tier2:
    name: Tier 2 Real-Azure Smoke
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate ephemeral SSH keypair
        id: ssh
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          chmod 700 "$d"
          ssh-keygen -t ed25519 -N '' -C 'image-bake-smoke' -f "$d/id" >/dev/null
          chmod 600 "$d/id"
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - name: Provision smoke-test VM
        id: provision
        env:
          GALLERY_VERSION: ${{ needs.publish.outputs.gallery_version }}
          SSH_DIR:         ${{ steps.ssh.outputs.dir }}
          GH_PAT:          ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$GH_PAT"

          # Per-run RG name so concurrent / retried runs cannot collide and
          # async (--no-wait) teardown of one run cannot race a fresh run.
          SMOKE_RG="rg-${{ env.PROJECT_NAME }}-smoke-${{ github.run_id }}-${{ github.run_attempt }}"
          VM_NAME="vm-smoke-${{ github.run_id }}"

          # Emit names to $GITHUB_OUTPUT *before* any provisioning so the
          # always() teardown step can clean up even if a later az command
          # in this step fails partway through.
          echo "smoke_rg=$SMOKE_RG"  >> "$GITHUB_OUTPUT"
          echo "vm_name=$VM_NAME"    >> "$GITHUB_OUTPUT"

          GALLERY_RG="rg-${{ env.PROJECT_NAME }}-gallery-${{ env.DEPLOYMENT_LOCATION }}"
          GALLERY_NAME=$(az deployment sub show \
            --name "landing-zone-${{ env.PROJECT_NAME }}" \
            --query 'properties.outputs.galleryName.value' -o tsv)
          IMAGE_DEF=$(az deployment sub show \
            --name "landing-zone-${{ env.PROJECT_NAME }}" \
            --query 'properties.outputs.imageDefinitionName.value' -o tsv)

          IMAGE_ID=$(az sig image-version show \
            --resource-group "$GALLERY_RG" \
            --gallery-name "$GALLERY_NAME" \
            --gallery-image-definition "$IMAGE_DEF" \
            --gallery-image-version "$GALLERY_VERSION" \
            --query id -o tsv)

          # Create the per-run smoke RG (fresh; should not pre-exist).
          az group create --name "$SMOKE_RG" \
            --location "${{ env.DEPLOYMENT_LOCATION }}" --output none

          PUBKEY=$(cat "$SSH_DIR/id.pub")

          # ── Build cloud-init customData ────────────────────────────────
          # Write the GitHub PAT to /etc/comin-bootstrap-token so Comin
          # can authenticate on first boot. This works for both public and
          # private repos: public repos accept authenticated requests
          # (avoids rate-limit), private repos require them.
          #
          # NB: heredoc body uses "<10 spaces><tab><content>" pattern.
          # The spaces satisfy this `run: |` YAML block scalar's indent;
          # the tab is stripped by `<<-CLOUDINIT` (POSIX <<- strips tabs).
          CLOUD_INIT=$(cat <<-CLOUDINIT
          	#cloud-config
          	write_files:
          	  - path: /etc/comin-bootstrap-token
          	    permissions: '0400'
          	    owner: root:root
          	    content: |
          	      ${GH_PAT}
          	CLOUDINIT
          )
          # Write cloud-init to a temp file for --custom-data (az cli
          # expects a file path, not process substitution).
          CLOUD_INIT_FILE=$(mktemp)
          trap 'rm -f "$CLOUD_INIT_FILE"' EXIT
          printf '%s' "$CLOUD_INIT" > "$CLOUD_INIT_FILE"

          # Standard_D4ads_v7 is an NVMe-only SKU (no SCSI controller for the
          # OS disk), so we must explicitly request the NVMe disk controller.
          # The image definition already advertises "SCSI, NVMe" support via
          # infra/modules/gallery/main.bicep (DiskControllerTypes feature).
          # --computer-name plaz-smoke matches nixosConfigurations.plaz-smoke
          # so Comin can find the correct configuration to apply.
          az vm create \
            --resource-group "$SMOKE_RG" \
            --name "$VM_NAME" \
            --image "$IMAGE_ID" \
            --size Standard_D4ads_v7 \
            --disk-controller-type NVMe \
            --admin-username azureuser \
            --ssh-key-value "$PUBKEY" \
            --public-ip-sku Standard \
            --computer-name plaz-smoke \
            --custom-data "$CLOUD_INIT_FILE" \
            --output none

          VM_IP=$(az vm show -d \
            --resource-group "$SMOKE_RG" --name "$VM_NAME" \
            --query publicIps -o tsv)

          echo "vm_ip=$VM_IP"        >> "$GITHUB_OUTPUT"

      - name: Wait for waagent ready
        env:
          SMOKE_RG: ${{ steps.provision.outputs.smoke_rg }}
          VM_NAME:  ${{ steps.provision.outputs.vm_name }}
        run: |
          set -euo pipefail
          display="unknown"
          for i in $(seq 1 30); do
            # Default to '{}' so jq always parses valid JSON even if az fails
            # transiently or the vmAgent block isn't populated yet. Use ?//
            # accessors so missing fields don't error out under set -e.
            agent_status=$(az vm get-instance-view \
              --resource-group "$SMOKE_RG" --name "$VM_NAME" \
              --query 'instanceView.vmAgent' -o json 2>/dev/null || echo '{}')
            if [ -z "$agent_status" ] || [ "$agent_status" = "null" ]; then
              agent_status='{}'
            fi
            display=$(echo "$agent_status"   | jq -r '(.statuses[0].displayStatus // "unknown")')
            message=$(echo "$agent_status"   | jq -r '(.statuses[0].message       // "unknown")')
            version=$(echo "$agent_status"   | jq -r '(.vmAgentVersion            // "unknown")')
            heartbeat=$(echo "$agent_status" | jq -r '(.statuses[0].time          // "unknown")')
            echo "attempt $i: status=$display version=$version message=$message heartbeat=$heartbeat"
            [ "$display" = "Ready" ] && { echo "waagent is ready"; break; }
            sleep 10
          done
          [ "$display" != "Ready" ] && {
            echo "::error::waagent did not become ready after 30 attempts"
            exit 1
          } || true

      - name: Write bootstrap token via run-command
        # cloud-init's write_files directive is silently ignored on NixOS
        # because the NixOS cloud-init module does not include the write-files
        # module in its generated cloud.cfg. Bypass cloud-init entirely by
        # writing the token directly via az vm run-command after waagent is
        # ready. This is reliable and immediate regardless of image version.
        # The image-bake/flake.nix fix (cloud_config_modules += write-files)
        # makes cloud-init correct for future VMs; this step keeps the smoke
        # test working right now on any already-published image version.
        env:
          SMOKE_RG: ${{ steps.provision.outputs.smoke_rg }}
          VM_NAME:  ${{ steps.provision.outputs.vm_name }}
          GH_PAT:   ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$GH_PAT"

          # Base64-encode the token so it can be embedded safely in the
          # single-quoted --scripts string without shell quoting issues
          # (base64 output is always [A-Za-z0-9+/=], safe in single quotes).
          ENCODED_TOKEN=$(printf '%s' "$GH_PAT" | base64 -w0)

          az vm run-command invoke \
            --resource-group "$SMOKE_RG" --name "$VM_NAME" \
            --command-id RunShellScript \
            --scripts "
              export PATH=/run/current-system/sw/bin:/run/current-system/sw/sbin:\$PATH
              set -euo pipefail
              printf '%s' '$ENCODED_TOKEN' | base64 -d | install -m 0400 /dev/stdin /etc/comin-bootstrap-token
              systemctl reset-failed comin.service || true
              systemctl restart comin.service
              echo 'Bootstrap token written and comin restarted'
            " \
            --output json

      - name: Wait for Comin to complete first deployment
        env:
          SMOKE_RG: ${{ steps.provision.outputs.smoke_rg }}
          VM_NAME:  ${{ steps.provision.outputs.vm_name }}
        run: |
          set -euo pipefail
          # NixOS: waagent run-command uses a minimal PATH (/usr/bin:/bin).
          # All NixOS system binaries live under /run/current-system/sw/bin.
          # This preamble must be the first line of every run-command script.
          NIXOS_PATH_PREAMBLE='export PATH=/run/current-system/sw/bin:/run/current-system/sw/sbin:$PATH'

          echo "Polling for Comin to complete its first deployment (generation > 1)..."
          for i in $(seq 1 30); do
            OUT=$(az vm run-command invoke \
              --resource-group "$SMOKE_RG" --name "$VM_NAME" \
              --command-id RunShellScript \
              --scripts "
                $NIXOS_PATH_PREAMBLE
                set -euo pipefail
                # Generation count in the system profile.
                # Generation 1 = the baked image. Generation 2+ = Comin applied at least once.
                gen_count=\$(nix-env --list-generations --profile /nix/var/nix/profiles/system 2>/dev/null | grep -cE '^[[:space:]]*[0-9]+' || echo 0)
                echo \"GENERATION_COUNT=\$gen_count\"
                # Also emit current hostname to confirm plaz-smoke config is applied
                echo \"HOSTNAME=\$(hostname)\"
                # Detect permanent crash-loop — fail fast instead of polling 30 times.
                # systemd stops restarting a service after too many rapid failures
                # (StartLimitHit); at that point SubState=failed and is-failed=failed.
                comin_state=\$(systemctl is-failed comin.service 2>/dev/null || true)
                sub_state=\$(systemctl show -p SubState --value comin.service 2>/dev/null || echo 'unknown')
                if [ \"\$comin_state\" = 'failed' ] && [ \"\$sub_state\" = 'failed' ]; then
                  echo 'COMIN_STATE=crash-loop'
                else
                  echo 'COMIN_STATE=ok'
                fi
                # Emit comin journal tail for visibility
                echo '=== comin journal ==='
                journalctl -u comin --no-pager -n 20 2>/dev/null || true
              " \
              --output json 2>/dev/null || echo '{"value":[{"message":""}]}')
            STDOUT=$(echo "$OUT" | jq -r '.value[0].message // ""')
            echo "--- attempt $i ---"
            echo "$STDOUT"
            GEN=$(echo "$STDOUT" | grep -oP 'GENERATION_COUNT=\K[0-9]+' || echo "0")
            COMIN_STATE=$(echo "$STDOUT" | grep -oP 'COMIN_STATE=\K\S+' || echo "ok")
            # Detect permanent crash-loop and fail immediately rather than
            # burning 30 poll rounds (~30 min) before giving up.
            if [ "$COMIN_STATE" = "crash-loop" ]; then
              echo "::error::comin.service is in a permanent crash-loop (StartLimitHit). Check the token file and comin config. Aborting early."
              exit 1
            fi
            if [ "${GEN:-0}" -ge 2 ]; then
              echo "✅ Comin applied successfully (generation count: $GEN)"
              echo "COMIN_DEPLOYED=true" >> "$GITHUB_ENV"
              break
            fi
            echo "Generation count: ${GEN:-0} — waiting 30s..."
            sleep 30
          done
          if [ "${COMIN_DEPLOYED:-false}" != "true" ]; then
            echo "::error::Comin did not complete a deployment after 30 attempts (~15 min)"
            exit 1
          fi

      - name: Assert via SSH (single attempt)
        env:
          VM_IP:   ${{ steps.provision.outputs.vm_ip }}
          SSH_DIR: ${{ steps.ssh.outputs.dir }}
        run: |
          set -euo pipefail
          # StrictHostKeyChecking=accept-new: accept the host key on first connection
          # only; reject if it changes. This is safe for ephemeral smoke-test VMs
          # that we provisioned moments ago and will destroy immediately after.
          SSH_OUT=$(ssh -i "$SSH_DIR/id" \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o IdentitiesOnly=yes \
            "azureuser@${VM_IP}" \
            'export PATH=/run/current-system/sw/bin:/run/current-system/sw/sbin:$PATH
             nixos-version && hostname && systemctl is-active comin && echo SSH_ASSERT_OK')
          echo "$SSH_OUT"
          echo "$SSH_OUT" | grep -q "plaz-smoke" || {
            echo "::error::SSH assert: hostname 'plaz-smoke' not found — Comin-applied config may not be live"
            exit 1
          }
          echo "$SSH_OUT" | grep -q "SSH_ASSERT_OK" || {
            echo "::error::SSH assert: SSH_ASSERT_OK sentinel missing"
            exit 1
          }

      - name: Tear down smoke RG
        if: always()
        env:
          SMOKE_RG: ${{ steps.provision.outputs.smoke_rg }}
        run: |
          [ -z "${SMOKE_RG:-}" ] && exit 0
          az group delete --name "$SMOKE_RG" --yes --no-wait \
            || echo "::warning::Failed to queue deletion of $SMOKE_RG — manual cleanup may be required"
          echo "Smoke RG $SMOKE_RG deletion queued"

      - name: Tag image version as blessed
        env:
          GALLERY_VERSION: ${{ needs.publish.outputs.gallery_version }}
        run: |
          set -euo pipefail

          GALLERY_RG="rg-${{ env.PROJECT_NAME }}-gallery-${{ env.DEPLOYMENT_LOCATION }}"
          GALLERY_NAME=$(az deployment sub show \
            --name "landing-zone-${{ env.PROJECT_NAME }}" \
            --query 'properties.outputs.galleryName.value' -o tsv)
          IMAGE_DEF=$(az deployment sub show \
            --name "landing-zone-${{ env.PROJECT_NAME }}" \
            --query 'properties.outputs.imageDefinitionName.value' -o tsv)

          IMAGE_VERSION_ID=$(az sig image-version show \
            --resource-group "$GALLERY_RG" \
            --gallery-name "$GALLERY_NAME" \
            --gallery-image-definition "$IMAGE_DEF" \
            --gallery-image-version "$GALLERY_VERSION" \
            --query id -o tsv)

          az tag create \
            --resource-id "$IMAGE_VERSION_ID" \
            --tags blessed=true \
                   tier2=passed \
                   bake-workflow=image-bake \
                   bake-run="${{ github.run_id }}" \
                   bake-sha="${{ github.sha }}"
          echo "✅ Tagged $GALLERY_VERSION as blessed=true (Tier 1 + Tier 2 passed)"

      - name: Job summary
        if: always()
        env:
          GALLERY_VERSION: ${{ needs.publish.outputs.gallery_version }}
        run: |
          {
            echo "### Tier 2 smoke summary"
            echo
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Gallery version | \`${GALLERY_VERSION:-n/a}\` |"
            echo "| Tier 2 | \`${{ job.status }}\` |"
            echo "| Blessed | \`${{ job.status == 'success' && 'true' || 'false' }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
