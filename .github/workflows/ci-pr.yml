# PR Validation Gate
#
# Runs on every pull request targeting main. Uses path filtering to run only
# the checks relevant to the paths that changed:
#   - infra filter: Bicep lint + az deployment what-if (subscription-scoped)
#   - nixos filter: nix flake check
#
# These jobs are intended to be configured as required status checks in branch
# protection so that nothing can merge to main without passing validation.
# This workflow NEVER deploys anything.

name: ci-pr

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write   # Required for OIDC (what-if step)
  contents: read
  pull-requests: read

env:
  DEPLOYMENT_LOCATION: southcentralus
  PROJECT_NAME: plaz

jobs:
  # ------------------------------------------------------------------
  # Detect which paths changed
  # ------------------------------------------------------------------
  filter:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.paths.outputs.infra }}
      nixos: ${{ steps.paths.outputs.nixos }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            infra:
              - 'infra/**'
              - '.github/workflows/ci-pr.yml'
              - '.github/workflows/deploy-workload.yml'
            nixos:
              - 'nixos/**'

  # ------------------------------------------------------------------
  # Validate Bicep (always runs so it can be a required check;
  # performs validation only if infra paths changed)
  # ------------------------------------------------------------------
  validate-infra:
    name: Validate Bicep
    needs: filter
    runs-on: ubuntu-latest
    steps:
      - name: No infra changes detected
        if: needs.filter.outputs.infra != 'true'
        run: echo "No changes under infra/**; skipping Bicep validation."

      - name: Checkout
        if: needs.filter.outputs.infra == 'true'
        uses: actions/checkout@v4

      - name: Lint landing-zone template
        if: needs.filter.outputs.infra == 'true'
        run: az bicep build --file infra/landing-zone.bicep

      - name: Lint global template
        if: needs.filter.outputs.infra == 'true'
        run: az bicep build --file infra/global.bicep

      - name: Lint workload template
        if: needs.filter.outputs.infra == 'true'
        run: az bicep build --file infra/workload.bicep

      # Azure login is only possible on PRs from the same repo (not forks),
      # because OIDC federated credentials are scoped to this repository.
      - name: Azure Login (OIDC)
        if: needs.filter.outputs.infra == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if preview (global template)
        if: needs.filter.outputs.infra == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          # global.bicep reads CI_SP_OBJECT_ID via readEnvironmentVariable with
          # a '' default; empty is fine for what-if (skips RBAC role assignment
          # in the preview).
          CI_SP_OBJECT_ID: ''
        run: |
          set -euo pipefail
          # Validate every global parameter file so breaking changes to
          # global.bicep or its parameter files are caught in CI, not at
          # deploy time. `--location` only controls where the what-if record
          # metadata lives; resources go to the region specified by the
          # `location` parameter in each .bicepparam.
          for PARAM_FILE in infra/environments/*-global.bicepparam; do
            ENV_NAME=$(basename "$PARAM_FILE" -global.bicepparam)
            echo "::group::what-if global-${ENV_NAME}"
            az deployment sub what-if \
              --location "${{ env.DEPLOYMENT_LOCATION }}" \
              --template-file infra/global.bicep \
              --parameters "${PARAM_FILE}" \
              --name "whatif-${{ github.run_id }}-global-${ENV_NAME}"
            echo "::endgroup::"
          done

      - name: What-if preview (workload template)
        if: needs.filter.outputs.infra == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          ADMIN_SSH_PUBLIC_KEY: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}
          # These values are resolved at deploy time by deploy-workload.yml;
          # empty defaults allow the what-if preview to run without them.
          SUBNET_ID: ''
          LOG_ANALYTICS_WORKSPACE_ID: ''
          NIXOS_IMAGE_ID: ''
          CUSTOM_DATA_B64: ''
        run: |
          set -euo pipefail
          # Validate every workload parameter file so region-specific
          # mistakes (e.g. Singapore) are caught in CI, not at deploy time.
          # `az deployment sub what-if --location` only controls where the
          # what-if record metadata lives; resources go to the region
          # specified by the `location` parameter in each .bicepparam.
          for PARAM_FILE in infra/environments/*-workload.bicepparam; do
            ENV_NAME=$(basename "$PARAM_FILE" -workload.bicepparam)
            echo "::group::what-if ${ENV_NAME}"
            az deployment sub what-if \
              --location "${{ env.DEPLOYMENT_LOCATION }}" \
              --template-file infra/workload.bicep \
              --parameters "${PARAM_FILE}" \
              --name "whatif-${{ github.run_id }}-${ENV_NAME}"
            echo "::endgroup::"
          done

  # ------------------------------------------------------------------
  # Validate NixOS flake (always runs so it can be a required check;
  # performs validation only if nixos paths changed)
  # ------------------------------------------------------------------
  validate-nixos:
    name: Validate NixOS
    needs: filter
    runs-on: ubuntu-latest
    steps:
      - name: No NixOS changes detected
        if: needs.filter.outputs.nixos != 'true'
        run: echo "No changes under nixos/**; skipping NixOS validation."

      - name: Checkout
        if: needs.filter.outputs.nixos == 'true'
        uses: actions/checkout@v4

      - name: Install Nix
        if: needs.filter.outputs.nixos == 'true'
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check NixOS flake
        if: needs.filter.outputs.nixos == 'true'
        run: |
          cd nixos
          if [ ! -f flake.lock ]; then
            echo "Error: nixos/flake.lock is missing. Commit the lock file instead of generating it during CI."
            exit 1
          fi
          nix flake check --no-update-lock-file .
