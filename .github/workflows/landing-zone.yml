# landing-zone.yml — Deploy regional landing zone for one plaz environment
#
# Phase 6 of the workflow/image architecture refactor.
# See docs/architecture-refactor.md D4 for the CAF split rationale.
#
# Owns: monitoring RG + Log Analytics, network RG + VNET/subnets/NSGs/NAT.
#
# Project-wide (region-pinned) resources — the Compute Gallery and the
# project Key Vault — are NOT here; they are deployed once for the whole
# project by .github/workflows/global.yml. Secondary regions consume them
# from the `global-${PROJECT_NAME}` subscription deployment outputs.
#
# Trigger: manual or on changes to regional Bicep paths.
# Cadence: rare — only when network topology changes for a region.
#
# Outputs stored as subscription deployment 'landing-zone-${ENV}':
#   gatewaySubnetId, logAnalyticsWorkspaceId, etc.
# These are consumed by deploy-workload.yml at deploy time.

name: landing-zone

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment name (selects infra/environments/<name>-landing-zone.bicepparam)'
        required: true
        default: 'plaz'
  push:
    branches: [main]
    paths:
      - 'infra/landing-zone.bicep'
      - 'infra/modules/monitoring/**'
      - 'infra/modules/networking/**'
      - 'infra/environments/*-landing-zone.bicepparam'
      - '.github/workflows/landing-zone.yml'

permissions:
  id-token: write
  contents: read

env:
  # Region where the subscription-deployment record itself is created. Pin
  # this to the project's primary region; individual landing zones are
  # deployed to whatever region their `*-landing-zone.bicepparam` specifies
  # via the `location` parameter (e.g. plaz=southcentralus, plaz-sea=
  # southeastasia). `az deployment sub create --location` only controls
  # where the deployment record metadata lives, not where resources are
  # created — those locations come from the template.
  DEPLOYMENT_LOCATION: southcentralus
  PROJECT_NAME: plaz

concurrency:
  group: landing-zone-${{ github.event.inputs.environment || 'plaz' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate landing-zone template
        run: |
          set -euxo pipefail
          az bicep build --file infra/landing-zone.bicep

  deploy:
    name: Deploy Landing Zone
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Landing Zone Infrastructure
        run: |
          set -euxo pipefail
          ENV="${{ github.event.inputs.environment || env.PROJECT_NAME }}"
          if ! az deployment sub create \
            --location "${{ env.DEPLOYMENT_LOCATION }}" \
            --template-file infra/landing-zone.bicep \
            --parameters "infra/environments/${ENV}-landing-zone.bicepparam" \
            --name "landing-zone-${ENV}"; then
            echo "::error::Landing zone deployment failed. Fetching error details..."
            az deployment sub show \
              --name "landing-zone-${ENV}" \
              --query 'properties.error' -o json || true
            az deployment operation sub list \
              --name "landing-zone-${ENV}" \
              --query "[?properties.statusCode != 'OK'].{resource: properties.targetResource.resourceName, status: properties.statusCode, message: properties.statusMessage.error.message}" \
              -o table || true
            exit 1
          fi

      - name: Show Outputs
        run: |
          ENV="${{ github.event.inputs.environment || env.PROJECT_NAME }}"
          az deployment sub show \
            --name "landing-zone-${ENV}" \
            --query properties.outputs \
            --output table

      - name: Job summary
        if: always()
        run: |
          ENV="${{ github.event.inputs.environment || env.PROJECT_NAME }}"
          {
            echo "### landing-zone summary"
            echo
            SUBNET=$(az deployment sub show \
              --name "landing-zone-${ENV}" \
              --query 'properties.outputs.gatewaySubnetId.value' -o tsv 2>/dev/null || echo 'n/a')
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Environment | \`${ENV}\` |"
            echo "| Gateway subnet | \`${SUBNET}\` |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
