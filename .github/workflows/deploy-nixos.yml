# NixOS Configuration Deployment — GitOps Pull Model
#
# Uses a "push nudge / pull deploy" pattern:
#   1. GitHub Actions detects which VM's config changed (via path filtering).
#   2. For each changed VM, it calls `az vm run-command invoke` (using the
#      existing OIDC service principal — no SSH private key required).
#   3. The run-command passes an ephemeral GITHUB_TOKEN to the VM.
#   4. The VM runs `nixos-rebuild switch --flake` pulling its own config
#      directly from this private GitHub repository using that token.
#   5. The token expires when the workflow ends and is NEVER stored on the VM.
#
# Required secrets (same OIDC set as deploy-infra — no new secrets needed):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#
# To add a new VM:
#   1. Create a nixos/hosts/<vmname>/ directory with default.nix and hardware.nix.
#   2. Add a filter entry for '<vmname>: nixos/hosts/<vmname>/**' in the filter job.
#   3. Duplicate the deploy-gw1 job, updating the filter key and VM name throughout.

name: deploy-nixos

on:
  push:
    branches: [main]
    paths:
      - 'nixos/**'
      - '.github/workflows/deploy-nixos.yml'
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC
  contents: read

env:
  DEPLOYMENT_LOCATION: southcentralus
  PROJECT_NAME: plaz

jobs:
  # ------------------------------------------------------------------
  # Validate NixOS flake
  # ------------------------------------------------------------------
  validate:
    name: Validate NixOS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check NixOS flake
        run: |
          cd nixos
          if [ ! -f flake.lock ]; then
            echo "error: nixos/flake.lock is missing. Commit the lock file and rerun CI."
            exit 1
          fi
          nix flake check . --no-update-lock-file

  # ------------------------------------------------------------------
  # Detect which VM configs changed
  # ------------------------------------------------------------------
  filter:
    name: Detect Changed VM Configs
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      gw1: ${{ steps.filter.outputs.gw1 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gw1:
              - 'nixos/hosts/gw1/**'
              - 'nixos/modules/**'
              - 'nixos/flake.nix'
              - 'nixos/flake.lock'
            # Future VMs: add entries here, e.g.:
            # vm2:
            #   - 'nixos/hosts/vm2/**'
            #   - 'nixos/modules/**'
            #   - 'nixos/flake.nix'
            #   - 'nixos/flake.lock'

  # ------------------------------------------------------------------
  # Deploy gw1 via Azure VM Run Command (GitOps pull nudge)
  #
  # How it works:
  #   - The GITHUB_TOKEN is passed as an environment variable into the
  #     run-command script. It is ephemeral: it expires when this workflow
  #     run ends and is NEVER written to disk or stored on the VM.
  #   - The VM is a NixOS host, so nixos-rebuild is always available.
  #   - The --parameters flag on `az vm run-command invoke` injects env vars
  #     into the script execution environment on the VM.
  # ------------------------------------------------------------------
  deploy-gw1:
    name: Deploy gw1
    needs: [validate, filter]
    runs-on: ubuntu-latest
    environment: production
    if: >
      needs.validate.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.filter.outputs.gw1 == 'true' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Nudge gw1 to pull and apply its NixOS config
        # The GITHUB_TOKEN is passed ephemerally to the VM via --parameters.
        # It grants read access to this private repo only for the duration of
        # this workflow run. The VM uses it to pull the flake and run
        # nixos-rebuild switch, then the token expires automatically.
        # No SSH private key is required — the Azure control plane handles auth.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Mask the token so it does not appear in the Actions log.
          echo "::add-mask::$GH_TOKEN"

          # az vm run-command invoke exits non-zero if the script fails, so
          # the command's own exit code is the reliable signal.
          OUTPUT=$(az vm run-command invoke \
            --resource-group "rg-${{ env.PROJECT_NAME }}-compute-${{ env.DEPLOYMENT_LOCATION }}" \
            --name "vm-${{ env.PROJECT_NAME }}-gw1-${{ env.DEPLOYMENT_LOCATION }}" \
            --command-id RunShellScript \
            --scripts "export NIX_CONFIG=\"access-tokens = github.com=\${GITHUB_TOKEN}\" && nixos-rebuild switch --flake \"github:${{ github.repository }}#gw1\" 2>&1" \
            --parameters "GITHUB_TOKEN=$GH_TOKEN" \
            --output json)

          # Extract and print the command output so it is visible in the Actions log.
          echo "$OUTPUT" | jq -r '.value[0].message'
