# NixOS Configuration Deployment — GitOps Pull Model
#
# Uses a "push nudge / pull deploy" pattern:
#   1. GitHub Actions detects which VM's config changed (via path filtering).
#   2. For each changed VM, it calls `az vm run-command invoke` (using the
#      existing OIDC service principal — no SSH private key required).
#   3. The run-command passes an ephemeral GITHUB_TOKEN to the VM.
#   4. The VM runs `nixos-rebuild switch --flake` pulling its own config
#      directly from this private GitHub repository using that token.
#   5. The token expires when the workflow ends and is NEVER stored on the VM.
#
# Required secrets (same OIDC set as deploy-infra — no new secrets needed):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#
# To add a new VM:
#   1. Create a nixos/hosts/<vmname>/ directory with default.nix and hardware.nix.
#   2. Add a filter entry for '<vmname>: nixos/hosts/<vmname>/**' in the filter job.
#   3. Duplicate the deploy-gw1 job, updating the filter key and VM name throughout.

name: deploy-nixos

on:
  push:
    branches: [main]
    paths:
      - 'nixos/**'
      - '.github/workflows/deploy-nixos.yml'
  workflow_run:
    workflows: ["deploy-infra"]
    types: [completed]
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC
  contents: read

env:
  DEPLOYMENT_LOCATION: southcentralus
  PROJECT_NAME: plaz

jobs:
  # ------------------------------------------------------------------
  # Validate NixOS flake
  # ------------------------------------------------------------------
  validate:
    name: Validate NixOS
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check NixOS flake
        run: |
          cd nixos
          if [ ! -f flake.lock ]; then
            echo "error: nixos/flake.lock is missing. Commit the lock file and rerun CI."
            exit 1
          fi
          nix flake check . --no-update-lock-file

  # ------------------------------------------------------------------
  # Detect which VM configs changed
  # ------------------------------------------------------------------
  filter:
    name: Detect Changed VM Configs
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      gw1: ${{ steps.filter.outputs.gw1 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gw1:
              - 'nixos/hosts/gw1/**'
              - 'nixos/modules/**'
              - 'nixos/flake.nix'
              - 'nixos/flake.lock'
              - '.github/workflows/deploy-nixos.yml'
            # Future VMs: add entries here, e.g.:
            # vm2:
            #   - 'nixos/hosts/vm2/**'
            #   - 'nixos/modules/**'
            #   - 'nixos/flake.nix'
            #   - 'nixos/flake.lock'

  # ------------------------------------------------------------------
  # Deploy gw1 via Azure VM Run Command (GitOps pull nudge)
  #
  # How it works:
  #   - The GITHUB_TOKEN is passed as an environment variable into the
  #     run-command script. It is ephemeral: it expires when this workflow
  #     run ends and is NEVER written to disk or stored on the VM.
  #   - The VM is a NixOS host, so nixos-rebuild is always available.
  #   - The --parameters flag on `az vm run-command invoke` injects env vars
  #     into the script execution environment on the VM.
  # ------------------------------------------------------------------
  deploy-gw1:
    name: Deploy gw1
    needs: [validate, filter]
    runs-on: ubuntu-latest
    environment: production
    if: >
      needs.validate.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run') &&
      (needs.filter.outputs.gw1 == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run')
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure gw1 is running
        id: ensure-vm
        # The VM may be deallocated overnight by an org-level cost-control policy.
        # This step ensures it is running before attempting az vm run-command invoke,
        # which fails immediately if the VM is not in a running state.
        # If the VM or resource group doesn't exist yet (e.g. infra was deleted for
        # redeployment), the step sets vm_ready=false and subsequent steps are skipped.
        run: |
          set -euo pipefail
          RG="rg-${{ env.PROJECT_NAME }}-compute-${{ env.DEPLOYMENT_LOCATION }}"
          VM_NAME="vm-${{ env.PROJECT_NAME }}-gw1-${{ env.DEPLOYMENT_LOCATION }}"

          VM_VIEW_OUTPUT=""
          VM_VIEW_EXIT=0
          VM_VIEW_OUTPUT=$(az vm get-instance-view \
            --resource-group "$RG" \
            --name "$VM_NAME" \
            --query "instanceView.statuses[?starts_with(code, 'PowerState/')].code" \
            --output tsv 2>&1) || VM_VIEW_EXIT=$?

          if [ $VM_VIEW_EXIT -ne 0 ]; then
            if echo "$VM_VIEW_OUTPUT" | grep -qi "could not be found\|ResourceNotFound\|ResourceGroupNotFound"; then
              echo "::warning::VM or resource group does not exist yet. Skipping deployment. Run deploy-infra first."
              echo "vm_ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "::error::Unexpected error querying VM: $VM_VIEW_OUTPUT"
              exit 1
            fi
          fi

          POWER_STATE="$VM_VIEW_OUTPUT"
          echo "Current power state: $POWER_STATE"
          if [ "$POWER_STATE" != "PowerState/running" ]; then
            echo "VM is not running (state: $POWER_STATE). Starting VM..."
            az vm start --resource-group "$RG" --name "$VM_NAME"
            echo "VM started successfully."
          else
            echo "VM is already running. Skipping start."
          fi
          echo "vm_ready=true" >> "$GITHUB_OUTPUT"

      - name: Nudge gw1 to pull and apply its NixOS config
        if: steps['ensure-vm'].outputs.vm_ready != 'false'
        # The GITHUB_TOKEN is passed ephemerally to the VM via --parameters.
        # It grants read access to this private repo only for the duration of
        # this workflow run. The VM uses it to pull the flake and run
        # nixos-rebuild switch, then the token expires automatically.
        # No SSH private key is required — the Azure control plane handles auth.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Mask the token so it does not appear in the Actions log.
          echo "::add-mask::$GH_TOKEN"

          # az vm run-command invoke always exits 0 regardless of remote script
          # outcome. We must parse the JSON response to detect failures.
          # stderr is merged into stdout (2>&1) so all output lands in the
          # StdOut field of the Run Command JSON response, maximising visibility
          # in the Actions log. We detect failures via the /failed status code
          # and a NIXOS_REBUILD_SUCCESS sentinel emitted on success.
          OUTPUT=$(az vm run-command invoke \
            --resource-group "rg-${{ env.PROJECT_NAME }}-compute-${{ env.DEPLOYMENT_LOCATION }}" \
            --name "vm-${{ env.PROJECT_NAME }}-gw1-${{ env.DEPLOYMENT_LOCATION }}" \
            --command-id RunShellScript \
            --scripts $'set -euo pipefail\nsource /etc/profile\nexport NIX_CONFIG="access-tokens = github.com=${GITHUB_TOKEN}"\nnixos-rebuild switch --flake "github:${{ github.repository }}?dir=nixos#gw1" --show-trace 2>&1\necho "NIXOS_REBUILD_SUCCESS"' \
            --parameters "GITHUB_TOKEN=$GH_TOKEN" \
            --output json)

          # Print the full stdout (which now includes merged stderr) for visibility.
          STDOUT=$(echo "$OUTPUT" | jq -r '.value[] | select(.code | test("StdOut")) | .message // empty')
          STDERR=$(echo "$OUTPUT" | jq -r '.value[] | select(.code | test("StdErr")) | .message // empty')
          echo "--- stdout (includes stderr) ---"
          echo "$STDOUT"
          if [ -n "$STDERR" ]; then
            echo "--- stderr ---"
            echo "$STDERR"
          fi

          # Detect failure: any value entry whose code contains "/failed" indicates
          # the remote script exited non-zero.
          FAILED=$(echo "$OUTPUT" | jq -r '[.value[] | select(.code | test("/failed"))] | length')
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::Remote script failed (Run Command reported a failed status)."
            exit 1
          fi

          # Also verify the success sentinel is present in stdout.
          if ! echo "$STDOUT" | grep -q "NIXOS_REBUILD_SUCCESS"; then
            echo "::error::nixos-rebuild did not emit the success sentinel — deployment likely failed."
            exit 1
          fi
