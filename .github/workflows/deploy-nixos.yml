# NixOS Configuration Deployment — GitOps Pull Model
#
# Uses a "push nudge / pull deploy" pattern:
#   1. GitHub Actions detects which VM's config changed (via path filtering).
#   2. For each changed VM, it opens a temporary SSH inbound rule in the NSG
#      (scoped to the runner's ephemeral IP), then SSHes into the VM.
#   3. The VM runs `nixos-rebuild switch --flake` pulling its own config
#      directly from this private GitHub repository using an ephemeral
#      GITHUB_TOKEN passed via NIX_CONFIG.
#   4. The temporary NSG rule is removed when the workflow ends.
#   5. The token expires when the workflow ends and is NEVER stored on the VM.
#
# Why SSH instead of az vm run-command invoke?
#   az vm run-command invoke installs the RunCommandLinux VM extension, which
#   ships as a dynamically-linked binary.  NixOS cannot run generic
#   dynamically-linked binaries without nix-ld, and nix-ld (already in
#   base.nix) can only be applied by a nixos-rebuild — creating a bootstrap
#   deadlock.  SSH bypasses the Azure extension mechanism entirely.
#
# Required secrets:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID  (OIDC — same as deploy-infra)
#   DEPLOY_SSH_PRIVATE_KEY  (private key matching ADMIN_SSH_PUBLIC_KEY; see docs/secrets.md)
#
# To add a new VM:
#   1. Create a nixos/hosts/<vmname>/ directory with default.nix and hardware.nix.
#   2. Add a filter entry for '<vmname>: nixos/hosts/<vmname>/**' in the filter job.
#   3. Duplicate the deploy-gw1 job, updating the filter key and VM name throughout.


name: deploy-nixos

on:
  push:
    branches: [main]
    paths:
      - 'nixos/**'
      - '.github/workflows/deploy-nixos.yml'
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC
  contents: read

env:
  DEPLOYMENT_LOCATION: southcentralus
  PROJECT_NAME: plaz

jobs:
  # ------------------------------------------------------------------
  # Validate NixOS flake
  # ------------------------------------------------------------------
  validate:
    name: Validate NixOS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check NixOS flake
        run: |
          cd nixos
          if [ ! -f flake.lock ]; then
            echo "error: nixos/flake.lock is missing. Commit the lock file and rerun CI."
            exit 1
          fi
          nix flake check . --no-update-lock-file

  # ------------------------------------------------------------------
  # Detect which VM configs changed
  # ------------------------------------------------------------------
  filter:
    name: Detect Changed VM Configs
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      gw1: ${{ steps.filter.outputs.gw1 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gw1:
              - 'nixos/hosts/gw1/**'
              - 'nixos/modules/**'
              - 'nixos/flake.nix'
              - 'nixos/flake.lock'
              - '.github/workflows/deploy-nixos.yml'
            # Future VMs: add entries here, e.g.:
            # vm2:
            #   - 'nixos/hosts/vm2/**'
            #   - 'nixos/modules/**'
            #   - 'nixos/flake.nix'
            #   - 'nixos/flake.lock'

  # ------------------------------------------------------------------
  # Deploy gw1 via SSH (GitOps pull nudge)
  #
  # How it works:
  #   - A temporary NSG rule allows SSH from the runner's ephemeral IP.
  #   - The GITHUB_TOKEN is passed via NIX_CONFIG so nixos-rebuild can pull
  #     the flake from this private repo.  It is ephemeral: it expires when
  #     this workflow run ends and is NEVER written to disk or stored on the VM.
  #   - The VM is a NixOS host, so nixos-rebuild is always available.
  #   - The NSG rule is removed after deployment (or on failure).
  # ------------------------------------------------------------------
  deploy-gw1:
    name: Deploy gw1
    needs: [validate, filter]
    runs-on: ubuntu-latest
    environment: production
    if: >
      needs.validate.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.filter.outputs.gw1 == 'true' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure gw1 is running
        id: ensure-vm
        # The VM may be deallocated overnight by an org-level cost-control policy.
        # This step ensures it is running before attempting SSH deployment,
        # which fails immediately if the VM is not in a running state.
        # If the VM or resource group doesn't exist yet (e.g. infra was deleted for
        # redeployment), the step sets vm_ready=false and subsequent steps are skipped.
        run: |
          set -euo pipefail
          RG="rg-${{ env.PROJECT_NAME }}-compute-${{ env.DEPLOYMENT_LOCATION }}"
          VM_NAME="vm-${{ env.PROJECT_NAME }}-gw1-${{ env.DEPLOYMENT_LOCATION }}"

          VM_VIEW_OUTPUT=""
          VM_VIEW_EXIT=0
          VM_VIEW_OUTPUT=$(az vm get-instance-view \
            --resource-group "$RG" \
            --name "$VM_NAME" \
            --query "instanceView.statuses[?starts_with(code, 'PowerState/')].code" \
            --output tsv 2>&1) || VM_VIEW_EXIT=$?

          if [ $VM_VIEW_EXIT -ne 0 ]; then
            if echo "$VM_VIEW_OUTPUT" | grep -qi "could not be found\|ResourceNotFound\|ResourceGroupNotFound"; then
              echo "::warning::VM or resource group does not exist yet. Skipping deployment. Run deploy-infra first."
              echo "vm_ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "::error::Unexpected error querying VM: $VM_VIEW_OUTPUT"
              exit 1
            fi
          fi

          POWER_STATE="$VM_VIEW_OUTPUT"
          echo "Current power state: $POWER_STATE"
          if [ "$POWER_STATE" != "PowerState/running" ]; then
            echo "VM is not running (state: $POWER_STATE). Starting VM..."
            az vm start --resource-group "$RG" --name "$VM_NAME"
            echo "VM started successfully."
          else
            echo "VM is already running. Skipping start."
          fi
          echo "vm_ready=true" >> "$GITHUB_OUTPUT"

      - name: Open SSH in NSG for runner
        # Temporarily allow SSH from this GitHub Actions runner so we can deploy
        # via SSH below.  The rule is removed in the "Close SSH in NSG" step that
        # runs unconditionally (if: always()) after deployment completes or fails.
        #
        # Why SSH instead of az vm run-command invoke?
        #   az vm run-command invoke installs the RunCommandLinux VM extension,
        #   which ships as a dynamically-linked binary.  NixOS cannot execute
        #   generic dynamically-linked binaries without nix-ld — and nix-ld is
        #   enabled in base.nix but must first be applied via nixos-rebuild, creating
        #   a bootstrap deadlock.  SSH bypasses the Azure extension mechanism entirely
        #   and works on a fresh NixOS VM before any rebuild has taken place.
        id: open-ssh
        if: steps['ensure-vm'].outputs.vm_ready != 'false'
        run: |
          set -euo pipefail
          RUNNER_IP=$(curl -sf https://api.ipify.org)
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"

          NSG_RG="rg-${{ env.PROJECT_NAME }}-network-${{ env.DEPLOYMENT_LOCATION }}"
          NSG_NAME="nsg-${{ env.PROJECT_NAME }}-gateway-${{ env.DEPLOYMENT_LOCATION }}"

          # Remove any stale rule from a previous interrupted run before recreating.
          az network nsg rule delete \
            --resource-group "$NSG_RG" \
            --nsg-name "$NSG_NAME" \
            --name "AllowSSHFromRunner" 2>/dev/null || true

          az network nsg rule create \
            --resource-group "$NSG_RG" \
            --nsg-name "$NSG_NAME" \
            --name "AllowSSHFromRunner" \
            --priority 900 \
            --direction Inbound \
            --access Allow \
            --protocol Tcp \
            --source-address-prefix "${RUNNER_IP}/32" \
            --source-port-range '*' \
            --destination-address-prefix '*' \
            --destination-port-range 22

      - name: Deploy gw1 NixOS config via SSH
        if: steps['ensure-vm'].outputs.vm_ready != 'false'
        # The GITHUB_TOKEN is passed ephemerally to nixos-rebuild via NIX_CONFIG.
        # It grants read-only access to this private repo only for the duration of
        # this workflow run, then expires automatically — it is never stored on disk.
        #
        # sudo is required because nixos-rebuild switch needs root privileges.
        # base.nix sets security.sudo.wheelNeedsPassword = false so that azureuser
        # (a wheel member) can run sudo without a password over SSH.
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          echo "::add-mask::$GH_TOKEN"

          # Write SSH private key to a temp file; clean it up on exit.
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > /tmp/deploy_key
          trap 'rm -f /tmp/deploy_key' EXIT

          VM_IP=$(az network public-ip show \
            --resource-group "rg-${{ env.PROJECT_NAME }}-compute-${{ env.DEPLOYMENT_LOCATION }}" \
            --name "pip-${{ env.PROJECT_NAME }}-gw1-${{ env.DEPLOYMENT_LOCATION }}" \
            --query ipAddress -o tsv)

          # Run nixos-rebuild as root via sudo.
          # The command is sent via SSH stdin (heredoc) rather than as a
          # command-line argument so that NIX_CONFIG (which carries the
          # ephemeral GITHUB_TOKEN) is never visible in remote process listings
          # (/proc/<pid>/cmdline or `ps aux`).
          ssh \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            -o BatchMode=yes \
            -i /tmp/deploy_key \
            azureuser@"$VM_IP" sudo sh <<NIXOS_DEPLOY
set -e
NIX_CONFIG="access-tokens = github.com=$GH_TOKEN" nixos-rebuild switch --flake "github:${{ github.repository }}#gw1" 2>&1
NIXOS_DEPLOY

      - name: Close SSH in NSG
        # Always runs so the temporary inbound rule is cleaned up even if the
        # deployment step failed or was interrupted.
        if: always() && steps['open-ssh'].outcome == 'success'
        run: |
          az network nsg rule delete \
            --resource-group "rg-${{ env.PROJECT_NAME }}-network-${{ env.DEPLOYMENT_LOCATION }}" \
            --nsg-name "nsg-${{ env.PROJECT_NAME }}-gateway-${{ env.DEPLOYMENT_LOCATION }}" \
            --name "AllowSSHFromRunner" 2>/dev/null || true
