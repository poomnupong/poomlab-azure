# Azure Infrastructure Deployment
#
# Deploys plaz infrastructure to Azure using Bicep via OIDC authentication.
# Downloads the latest NixOS VHD from nixos-azimage-builder, stages it in an
# Azure Compute Gallery, and deploys the VM from the gallery image version.

name: deploy-infra

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Parameter file to use (without extension)'
        required: true
        default: 'plaz'

permissions:
  id-token: write   # Required for OIDC
  contents: read

env:
  DEPLOYMENT_LOCATION: southcentralus
  PROJECT_NAME: plaz

concurrency:
  group: infra-plaz-southcentralus
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Validate (runs on all triggers)
  # ------------------------------------------------------------------
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate main template
        run: |
          set -euxo pipefail
          az bicep build --file infra/main.bicep

      - name: Validate gallery template
        run: |
          set -euxo pipefail
          az bicep build --file infra/gallery.bicep

  # ------------------------------------------------------------------
  # Stage NixOS Image (only on push to main or manual dispatch)
  # ------------------------------------------------------------------
  stage-image:
    name: Stage NixOS Image
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      imageVersion: ${{ steps.stage.outputs.imageVersion }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Gallery Infrastructure
        run: |
          set -euxo pipefail
          az deployment sub create \
            --location "${{ env.DEPLOYMENT_LOCATION }}" \
            --template-file infra/gallery.bicep \
            --parameters location="${{ env.DEPLOYMENT_LOCATION }}" \
                         projectName="${{ env.PROJECT_NAME }}" \
            --name "gallery-${{ env.PROJECT_NAME }}"

      - name: Stage NixOS Image Version
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          LOCATION="${{ env.DEPLOYMENT_LOCATION }}"

          # ── Gallery info from deployment outputs ──────────────────────
          GALLERY_RG=$(az deployment sub show \
            --name "gallery-${{ env.PROJECT_NAME }}" \
            --query 'properties.outputs.galleryResourceGroup.value' -o tsv)
          GALLERY_NAME=$(az deployment sub show \
            --name "gallery-${{ env.PROJECT_NAME }}" \
            --query 'properties.outputs.galleryName.value' -o tsv)
          IMAGE_DEF=$(az deployment sub show \
            --name "gallery-${{ env.PROJECT_NAME }}" \
            --query 'properties.outputs.imageDefinitionName.value' -o tsv)

          echo "Gallery RG:  $GALLERY_RG"
          echo "Gallery:     $GALLERY_NAME"
          echo "Image Def:   $IMAGE_DEF"

          # ── Latest release from nixos-azimage-builder ─────────────────
          RELEASE_JSON=$(gh api repos/poomnupong/nixos-azimage-builder/releases/latest)
          RELEASE_TAG=$(echo "$RELEASE_JSON"  | jq -r '.tag_name')
          ASSET_NAME=$(echo "$RELEASE_JSON"   | jq -r '[.assets[] | select(.name | endswith(".vhd.gz"))][0].name // ""')
          ASSET_URL=$(echo "$RELEASE_JSON"    | jq -r '[.assets[] | select(.name | endswith(".vhd.gz"))][0].browser_download_url // ""')

          if [ -z "$ASSET_NAME" ] || [ -z "$ASSET_URL" ] || [[ "$ASSET_NAME" != *.vhd.gz ]]; then
            echo "Expected a release asset ending with .vhd.gz, but none was found."
            exit 1
          fi

          # Convert tag (e.g. nixos-25.11-20260429-2017) to gallery
          # version format Major.Minor.Patch → 2511.20260429.2017
          VERSION=$(echo "$RELEASE_TAG" | sed -E 's/^nixos-([0-9]+)\.([0-9]+)-([0-9]{8})-([0-9]{4})$/\1\2.\3.\4/')

          # Validate that VERSION matches the required Major.Minor.Patch format
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tag '$RELEASE_TAG' did not convert to a valid gallery image version (got '$VERSION'). Expected format: Major.Minor.Patch"
            exit 1
          fi

          echo "Release tag: $RELEASE_TAG"
          echo "Version:     $VERSION"
          echo "Asset:       $ASSET_NAME"

          # ── Check if this version already exists ──────────────────────
          EXISTING=$(az sig image-version show \
            --resource-group "$GALLERY_RG" \
            --gallery-name "$GALLERY_NAME" \
            --gallery-image-definition "$IMAGE_DEF" \
            --gallery-image-version "$VERSION" \
            --query id -o tsv 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            echo "✅ Image version $VERSION already exists"
            echo "imageVersion=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── Download VHD ──────────────────────────────────────────────
          echo "⬇️  Downloading $ASSET_NAME …"
          curl -fSL -o "$ASSET_NAME" "$ASSET_URL"

          echo "📦 Decompressing …"
          VHD_FILE="${ASSET_NAME%.gz}"
          gunzip "$ASSET_NAME"

          VHD_SIZE=$(stat -c %s "$VHD_FILE")
          echo "VHD size: $VHD_SIZE bytes"

          # ── Create managed disk via direct upload ─────────────────────
          DISK_NAME="nixos-staging-$(echo "$RELEASE_TAG" | tr '.' '-')"
          echo "💾 Creating managed disk $DISK_NAME …"
          DISK_ID=$(az disk create \
            --resource-group "$GALLERY_RG" \
            --name "$DISK_NAME" \
            --location "$LOCATION" \
            --upload-type Upload \
            --upload-size-bytes "$VHD_SIZE" \
            --hyper-v-generation V2 \
            --os-type Linux \
            --query id -o tsv)

          echo "🔑 Getting write SAS …"
          set +x  # ── hide SAS token from trace ──
          SAS=$(az disk grant-access \
            --resource-group "$GALLERY_RG" \
            --name "$DISK_NAME" \
            --access-level Write \
            --duration-in-seconds 3600 \
            --query accessSAS -o tsv)

          echo "⬆️  Uploading VHD …"
          azcopy copy "$VHD_FILE" "$SAS" --blob-type PageBlob
          set -x  # ── re-enable trace ──

          echo "🔒 Revoking disk access …"
          az disk revoke-access \
            --resource-group "$GALLERY_RG" \
            --name "$DISK_NAME"

          # ── Stamp NVMe + SCSI support on the staging disk ────────────
          # The image definition declares DiskControllerTypes but the
          # *source disk* must also carry the capability for the gallery
          # image version to inherit it (Azure requirement).
          echo "🏷️  Stamping disk controller support …"
          az rest --method PATCH \
            --url "${DISK_ID}?api-version=2024-03-02" \
            --body '{"properties":{"supportedCapabilities":{"diskControllerTypes":"SCSI, NVMe"}}}'

          # ── Create gallery image version ──────────────────────────────
          echo "🖼️  Creating image version $VERSION …"
          IMAGE_VERSION_ID=$(az sig image-version create \
            --resource-group "$GALLERY_RG" \
            --gallery-name "$GALLERY_NAME" \
            --gallery-image-definition "$IMAGE_DEF" \
            --gallery-image-version "$VERSION" \
            --location "$LOCATION" \
            --os-snapshot "$DISK_ID" \
            --query id -o tsv)

          echo "✅ Image version created: $VERSION"

          # ── Wait for replication to complete ─────────────────────────
          # az sig image-version create returns before the image is visible
          # to ARM's deployment service. Poll until replication completes.
          echo "Waiting for image version replication..."
          prov_state=""
          repl_state=""
          for i in $(seq 1 30); do
            prov_state=$(az sig image-version show \
              --resource-group "$GALLERY_RG" \
              --gallery-name "$GALLERY_NAME" \
              --gallery-image-definition "$IMAGE_DEF" \
              --gallery-image-version "$VERSION" \
              --query provisioningState -o tsv)
            repl_state=$(az sig image-version show \
              --resource-group "$GALLERY_RG" \
              --gallery-name "$GALLERY_NAME" \
              --gallery-image-definition "$IMAGE_DEF" \
              --gallery-image-version "$VERSION" \
              --expand ReplicationStatus \
              --query 'replicationStatus.aggregatedState' -o tsv 2>/dev/null || echo "Unknown")
            echo "  attempt $i: provisioningState=$prov_state aggregatedState=$repl_state"
            if [ "$prov_state" = "Succeeded" ] && [ "$repl_state" = "Completed" ]; then
              break
            elif [ "$prov_state" = "Failed" ]; then
              echo "::error::Image version replication failed"
              exit 1
            fi
            sleep 30
          done
          if [ "$prov_state" != "Succeeded" ] || [ "$repl_state" != "Completed" ]; then
            echo "::error::Image version replication timed out"
            exit 1
          fi
          echo "Image version replicated successfully"

          echo "imageVersion=$VERSION" >> "$GITHUB_OUTPUT"

          # ── Cleanup staging disk ──────────────────────────────────────
          echo "🧹 Deleting staging disk …"
          az disk delete \
            --resource-group "$GALLERY_RG" \
            --name "$DISK_NAME" \
            --yes --no-wait

  # ------------------------------------------------------------------
  # Deploy (only on push to main or manual dispatch)
  # ------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: [validate, stage-image]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Don't persist GITHUB_TOKEN as http.https://github.com/.extraheader.
          # The workflow's GITHUB_TOKEN is read-only (permissions.contents: read)
          # and would otherwise override the URL-embedded GH_PAT credentials in
          # the agenix auto-setup `git push`, causing HTTP 403. With this set,
          # no extraheader is written and the explicit URL-embedded PAT is the
          # only credential used for the push (and only for that one command).
          persist-credentials: false

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve NixOS Image Version ID
        id: resolve-image
        env:
          IMAGE_VERSION: ${{ needs.stage-image.outputs.imageVersion }}
        run: |
          set -euxo pipefail

          if [ -z "${IMAGE_VERSION:-}" ]; then
            echo "::error::IMAGE_VERSION is empty — stage-image may not have produced an output"
            exit 1
          fi

          GALLERY_RG="rg-${{ env.PROJECT_NAME }}-gallery-${{ env.DEPLOYMENT_LOCATION }}"
          GALLERY_NAME=$(az deployment sub show \
            --name "gallery-${{ env.PROJECT_NAME }}" \
            --query properties.outputs.galleryName.value -o tsv)
          IMAGE_DEF=$(az deployment sub show \
            --name "gallery-${{ env.PROJECT_NAME }}" \
            --query properties.outputs.imageDefinitionName.value -o tsv)

          if [ -z "${GALLERY_NAME:-}" ]; then
            echo "::error::Failed to resolve galleryName from deployment outputs for gallery-${{ env.PROJECT_NAME }}"
            exit 1
          fi

          if [ -z "${IMAGE_DEF:-}" ]; then
            echo "::error::Failed to resolve imageDefinitionName from deployment outputs for gallery-${{ env.PROJECT_NAME }}"
            exit 1
          fi
          echo "Looking up image version ${IMAGE_VERSION} …"
          IMAGE_VERSION_ID=$(az sig image-version show \
            --resource-group "$GALLERY_RG" \
            --gallery-name "$GALLERY_NAME" \
            --gallery-image-definition "$IMAGE_DEF" \
            --gallery-image-version "$IMAGE_VERSION" \
            --query id -o tsv 2>/dev/null || true)

          if [ -z "$IMAGE_VERSION_ID" ]; then
            echo "::error::Failed to resolve image version $IMAGE_VERSION — az sig image-version show returned empty"
            exit 1
          fi

          echo "Resolved image version: $IMAGE_VERSION"
          echo "NIXOS_IMAGE_ID=$IMAGE_VERSION_ID" >> "$GITHUB_ENV"

      - name: Delete VM if image changed
        run: |
          set -euxo pipefail

          VM_NAME="vm-${{ env.PROJECT_NAME }}-gw1-${{ env.DEPLOYMENT_LOCATION }}"
          RG="rg-${{ env.PROJECT_NAME }}-compute-${{ env.DEPLOYMENT_LOCATION }}"

          # Query VM image reference. az vm show fails for auth/CLI errors (which
          # should stop the workflow) but also for "not found" (which is benign).
          # Capture exit code and only ignore the specific not-found case.
          VM_SHOW_OUTPUT=""
          VM_SHOW_EXIT=0
          VM_SHOW_OUTPUT=$(az vm show \
            --resource-group "$RG" \
            --name "$VM_NAME" \
            --query 'storageProfile.imageReference.id' -o tsv 2>&1) || VM_SHOW_EXIT=$?

          if [ $VM_SHOW_EXIT -ne 0 ]; then
            if echo "$VM_SHOW_OUTPUT" | grep -qi "could not be found\|ResourceNotFound"; then
              echo "VM does not exist yet -- nothing to delete."
              exit 0
            else
              echo "::error::Unexpected error querying VM: $VM_SHOW_OUTPUT"
              exit 1
            fi
          fi

          CURRENT_IMAGE="$VM_SHOW_OUTPUT"

          if [ "$CURRENT_IMAGE" = "$NIXOS_IMAGE_ID" ]; then
            echo "VM already uses the target image -- no deletion needed."
            exit 0
          fi

          echo "Image changed:"
          echo "  current: $CURRENT_IMAGE"
          echo "  target:  $NIXOS_IMAGE_ID"
          echo "Deleting VM $VM_NAME so it can be recreated with the new image..."
          az vm delete \
            --resource-group "$RG" \
            --name "$VM_NAME" \
            --force-deletion yes \
            --yes

          # Signal to downstream steps (agenix, bootstrap) that the VM was
          # recreated and has a new SSH host key — secrets must be re-provisioned.
          echo "VM_RECREATED=true" >> "$GITHUB_ENV"

          # Delete the old OS disk synchronously so Bicep can recreate it
          OS_DISK="osdisk-${{ env.PROJECT_NAME }}-gw1-${{ env.DEPLOYMENT_LOCATION }}"
          echo "Deleting old OS disk $OS_DISK..."
          az disk delete \
            --resource-group "$RG" \
            --name "$OS_DISK" \
            --yes

      - name: Deploy Infrastructure
        env:
          ADMIN_SSH_PUBLIC_KEY: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}
        run: |
          set -euxo pipefail
          if ! az deployment sub create \
            --location "${{ env.DEPLOYMENT_LOCATION }}" \
            --template-file infra/main.bicep \
            --parameters infra/environments/${{ github.event.inputs.environment || 'plaz' }}.bicepparam \
            --name "deploy-${{ env.PROJECT_NAME }}"; then
            echo "::error::Bicep deployment failed. Fetching error details..."
            az deployment sub show \
              --name "deploy-${{ env.PROJECT_NAME }}" \
              --query 'properties.error' -o json || true
            az deployment operation sub list \
              --name "deploy-${{ env.PROJECT_NAME }}" \
              --query "[?properties.statusCode != 'OK'].{resource: properties.targetResource.resourceName, status: properties.statusCode, message: properties.statusMessage.error.message}" \
              -o table || true
            exit 1
          fi

      - name: Show Outputs
        run: |
          set -euxo pipefail
          az deployment sub show \
            --name "deploy-${{ env.PROJECT_NAME }}" \
            --query properties.outputs \
            --output table

      # ── Auto-populate agenix keys and encrypt secrets ────────────────
      # MUST run before bootstrap so that nixos-rebuild finds valid
      # age-encrypted .age files (not placeholders). Extracts the VM's
      # SSH host key, converts to an age public key, encrypts secrets,
      # and commits back to the repo.
      - name: Auto-setup agenix secrets for gw1
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euxo pipefail
          echo "::add-mask::$GH_PAT"

          RG="rg-${{ env.PROJECT_NAME }}-compute-${{ env.DEPLOYMENT_LOCATION }}"
          VM_NAME="vm-${{ env.PROJECT_NAME }}-gw1-${{ env.DEPLOYMENT_LOCATION }}"

          # ── Fast pre-check: skip if secrets already look good ────────
          # Check .age files BEFORE any expensive operations (installing
          # tools, querying the VM, extracting SSH keys). This avoids
          # ~60s+ of unnecessary work on every re-run against an already-
          # provisioned VM. We verify:
          #   1. The VM was NOT recreated earlier in this run (new host key
          #      means secrets.nix has the wrong recipient)
          #   2. secrets.nix exists and contains an age1… public key
          #   3. Both .age files have valid age ciphertext headers
          SECRETS_NIX="nixos/secrets/secrets.nix"
          COMIN_AGE="nixos/secrets/comin-github-token.age"
          TAILSCALE_AGE="nixos/secrets/tailscale-authkey.age"

          if [ "${VM_RECREATED:-}" = "true" ]; then
            echo "VM was recreated (new host key) — must re-provision secrets."
          elif grep -qE '^  gw1 = "age1[a-z0-9]+";' "$SECRETS_NIX" 2>/dev/null \
             && head -1 "$COMIN_AGE" 2>/dev/null | grep -q "^-----BEGIN AGE ENCRYPTED FILE-----" \
             && head -1 "$TAILSCALE_AGE" 2>/dev/null | grep -q "^-----BEGIN AGE ENCRYPTED FILE-----"; then
            echo "Age keys and encrypted secrets are already provisioned. Skipping."
            exit 0
          fi
          echo "Secrets need provisioning — continuing with full setup."

          # Check if VM exists and is running
          VM_VIEW_OUTPUT=""
          VM_VIEW_EXIT=0
          VM_VIEW_OUTPUT=$(az vm get-instance-view \
            --resource-group "$RG" \
            --name "$VM_NAME" \
            --query "instanceView.statuses[?starts_with(code, 'PowerState/')].code" \
            --output tsv 2>&1) || VM_VIEW_EXIT=$?

          if [ $VM_VIEW_EXIT -ne 0 ]; then
            if echo "$VM_VIEW_OUTPUT" | grep -qi "could not be found\|ResourceNotFound\|ResourceGroupNotFound"; then
              echo "::warning::VM does not exist yet. Skipping agenix setup."
              exit 0
            else
              echo "::error::Unexpected error querying VM: $VM_VIEW_OUTPUT"
              exit 1
            fi
          fi

          POWER_STATE="$VM_VIEW_OUTPUT"
          if [ "$POWER_STATE" != "PowerState/running" ]; then
            echo "VM is not running (state: $POWER_STATE). Starting VM..."
            az vm start --resource-group "$RG" --name "$VM_NAME"
          fi

          # ── Install age + ssh-to-age ──────────────────────────────────
          sudo apt-get update -qq && sudo apt-get install -y -qq age
          go install github.com/Mic92/ssh-to-age/cmd/ssh-to-age@latest
          export PATH="$HOME/go/bin:$PATH"

          # ── Wait for VM agent, then extract SSH host key → age public key ─
          # Use az vm wait to block until waagent reports ready, instead of
          # a manual retry loop. Timeout after 5 minutes.
          echo "Waiting for VM agent (waagent) to become ready..."
          az vm wait \
            --resource-group "$RG" \
            --name "$VM_NAME" \
            --custom "instanceView.vmAgent.statuses[?code=='ProvisioningState/succeeded']" \
            --timeout 300

          echo "VM agent is ready. Extracting SSH host key..."
          # Capture remote stdout via the shared helper (see
          # .github/scripts/az-run-command.sh for why direct jq parsing
          # of `az vm run-command invoke` output is fragile).
          # Wrap in `timeout` to avoid indefinite hangs from
          # `az vm run-command invoke` (observed in run #46).
          SSH_KEY_FILE=$(mktemp)
          timeout 300 .github/scripts/az-run-command.sh "$RG" "$VM_NAME" \
            'source /etc/profile && cat /etc/ssh/ssh_host_ed25519_key.pub' \
            > "$SSH_KEY_FILE"
          VM_SSH_PUBKEY=$(head -n 1 "$SSH_KEY_FILE" | xargs)
          rm -f "$SSH_KEY_FILE"

          if [ -z "$VM_SSH_PUBKEY" ] || ! echo "$VM_SSH_PUBKEY" | grep -q "ssh-ed25519"; then
            echo "::error::Failed to extract VM SSH ed25519 public key after agent became ready (see diagnostics above)"
            exit 1
          fi

          VM_AGE_PUBKEY=$(echo "$VM_SSH_PUBKEY" | ssh-to-age)
          echo "VM age public key: $VM_AGE_PUBKEY"

          # ── Update secrets.nix with real VM host key ──────────────────
          {
            echo '# secrets.nix — Agenix recipients list'
            echo '#'
            echo '# AUTO-POPULATED by deploy-infra.yml — do not edit the key values manually.'
            echo '# To rotate secrets, see docs/comin-deployment.md.'
            echo '#'
            echo '# VM keys extracted from SSH host keys via az vm run-command + ssh-to-age.'
            echo "# The VM's SSH host key is the only recipient — agenix decrypts on the VM"
            echo '# using /etc/ssh/ssh_host_ed25519_key (the private half of this key).'
            echo ''
            echo 'let'
            echo '  # ── VM host keys ────────────────────────────────────────────────'
            echo "  gw1 = \"$VM_AGE_PUBKEY\";"
            echo ''
            echo '  allSystems = [ gw1 ];'
            echo 'in'
            echo '{'
            echo '  "comin-github-token.age".publicKeys = allSystems;'
            echo '  "tailscale-authkey.age".publicKeys = allSystems;'
            echo '}'
          } > nixos/secrets/secrets.nix

          # ── Encrypt secrets with age ──────────────────────────────────
          # Encrypt GH_PAT → comin-github-token.age
          printf '%s' "$GH_PAT" | age -r "$VM_AGE_PUBKEY" -a > nixos/secrets/comin-github-token.age

          # Encrypt placeholder → tailscale-authkey.age
          # (will be replaced with a real key via agenix -e when available)
          printf 'PLACEHOLDER_REPLACE_WITH_REAL_KEY' | age -r "$VM_AGE_PUBKEY" -a > nixos/secrets/tailscale-authkey.age

          # ── Commit and push ───────────────────────────────────────────
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nixos/secrets/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-populate agenix keys and secrets for gw1 [skip ci]"
            git push "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git" HEAD:main
            echo "✅ Agenix keys and secrets committed."
          fi

      # ── Bootstrap Comin on fresh VMs ─────────────────────────────────
      # Runs AFTER agenix secrets are committed so that nixos-rebuild
      # finds valid age-encrypted .age files. This one-time step:
      #   1. Injects an ephemeral SSH key via az vm run-command invoke
      #   2. Copies the GitHub PAT to the VM via scp
      #   3. Runs nixos-rebuild switch via SSH (output streams in real time)
      # After this, Comin takes over — all subsequent config changes are
      # pulled automatically from this repo.
      - name: Bootstrap Comin on gw1
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euxo pipefail
          echo "::add-mask::$GH_PAT"

          RG="rg-${{ env.PROJECT_NAME }}-compute-${{ env.DEPLOYMENT_LOCATION }}"
          VM_NAME="vm-${{ env.PROJECT_NAME }}-gw1-${{ env.DEPLOYMENT_LOCATION }}"

          # Check if VM exists and is running (may already be running from agenix step)
          VM_VIEW_OUTPUT=""
          VM_VIEW_EXIT=0
          VM_VIEW_OUTPUT=$(az vm get-instance-view \
            --resource-group "$RG" \
            --name "$VM_NAME" \
            --query "instanceView.statuses[?starts_with(code, 'PowerState/')].code" \
            --output tsv 2>&1) || VM_VIEW_EXIT=$?

          if [ $VM_VIEW_EXIT -ne 0 ]; then
            if echo "$VM_VIEW_OUTPUT" | grep -qi "could not be found\|ResourceNotFound\|ResourceGroupNotFound"; then
              echo "::warning::VM does not exist yet. Skipping Comin bootstrap."
              exit 0
            else
              echo "::error::Unexpected error querying VM: $VM_VIEW_OUTPUT"
              exit 1
            fi
          fi

          POWER_STATE="$VM_VIEW_OUTPUT"
          if [ "$POWER_STATE" != "PowerState/running" ]; then
            echo "VM is not running (state: $POWER_STATE). Starting VM..."
            az vm start --resource-group "$RG" --name "$VM_NAME"
          fi

          # ── Skip if Comin is already running (idempotency) ───────────
          # On an already-bootstrapped VM, Comin is self-sustaining and
          # re-running nixos-rebuild (30-60+ min) is unnecessary. Check
          # the service status before launching the expensive rebuild.
          echo "Checking if Comin is already active on $VM_NAME..."
          az vm wait \
            --resource-group "$RG" \
            --name "$VM_NAME" \
            --custom "instanceView.vmAgent.statuses[?code=='ProvisioningState/succeeded']" \
            --timeout 300

          COMIN_CHECK=$(mktemp)
          timeout 300 .github/scripts/az-run-command.sh "$RG" "$VM_NAME" \
            'set +u; source /etc/profile; set -u; systemctl is-active comin 2>/dev/null || echo inactive' \
            > "$COMIN_CHECK" 2>/dev/null || true
          COMIN_STATUS=$(head -n 1 "$COMIN_CHECK" | xargs)
          rm -f "$COMIN_CHECK"

          if [ "$COMIN_STATUS" = "active" ]; then
            echo "✅ Comin is already active on $VM_NAME. Skipping bootstrap."
            exit 0
          fi
          echo "Comin is not active (status: ${COMIN_STATUS:-unknown}). Proceeding with bootstrap..."

          # ── Variables used by cleanup trap (initialised early so trap is safe) ─
          NETWORK_RG="rg-${{ env.PROJECT_NAME }}-network-${{ env.DEPLOYMENT_LOCATION }}"
          NSG_NAME="nsg-${{ env.PROJECT_NAME }}-gateway-${{ env.DEPLOYMENT_LOCATION }}"
          NSG_RULE_NAME=""
          VM_IP=""
          EPHEMERAL_KEY_DIR=""
          EPHEMERAL_KEY_COMMENT=""
          PAT_FILE=""
          KNOWN_HOSTS_FILE=""

          # ── Cleanup trap: runs on EXIT (success or failure) ───────────────────
          cleanup_ssh() {
            echo "Cleaning up ephemeral resources..."
            # Remove SSH key and temporary sudoers entry from the VM
            if [ -d "${EPHEMERAL_KEY_DIR}" ] && [ -n "${VM_IP}" ] && [ -n "${EPHEMERAL_KEY_COMMENT}" ]; then
              if [ -f "${KNOWN_HOSTS_FILE}" ]; then
                ssh -i "${EPHEMERAL_KEY_DIR}/id" \
                  -o UserKnownHostsFile="${KNOWN_HOSTS_FILE}" -o StrictHostKeyChecking=yes \
                  -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes \
                  "azureuser@${VM_IP}" \
                  "sed -i '/${EPHEMERAL_KEY_COMMENT}/d' ~/.ssh/authorized_keys && sudo rm -f /etc/sudoers.d/bootstrap-temp" \
                  2>/dev/null || true
              else
                ssh -i "${EPHEMERAL_KEY_DIR}/id" \
                  -o StrictHostKeyChecking=no \
                  -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes \
                  "azureuser@${VM_IP}" \
                  "sed -i '/${EPHEMERAL_KEY_COMMENT}/d' ~/.ssh/authorized_keys && sudo rm -f /etc/sudoers.d/bootstrap-temp" \
                  2>/dev/null || true
              fi
            fi
            # Remove temporary NSG rule that allowed runner SSH access
            if [ -n "${NSG_RULE_NAME}" ]; then
              az network nsg rule delete \
                --resource-group "${NETWORK_RG}" \
                --nsg-name "${NSG_NAME}" \
                --name "${NSG_RULE_NAME}" 2>/dev/null || true
            fi
            [ -n "${EPHEMERAL_KEY_DIR}" ] && rm -rf "${EPHEMERAL_KEY_DIR}" 2>/dev/null || true
            [ -n "${PAT_FILE}" ]          && rm -f  "${PAT_FILE}"          2>/dev/null || true
            [ -n "${KNOWN_HOSTS_FILE}" ]  && rm -f  "${KNOWN_HOSTS_FILE}"  2>/dev/null || true
          }
          trap cleanup_ssh EXIT

          # ── Get VM public IP for SSH ─────────────────────────────────────────
          VM_IP=$(az vm show -d --resource-group "$RG" --name "$VM_NAME" --query publicIps -o tsv)
          if [ -z "$VM_IP" ]; then
            echo "::error::Could not resolve public IP for $VM_NAME"
            exit 1
          fi

          # ── Generate ephemeral SSH keypair ────────────────────────────────────
          EPHEMERAL_KEY_DIR=$(mktemp -d)
          chmod 700 "$EPHEMERAL_KEY_DIR"
          EPHEMERAL_KEY_COMMENT="deploy-infra-ephemeral-$$-$(date +%s)"
          ssh-keygen -t ed25519 -N '' -C "$EPHEMERAL_KEY_COMMENT" -f "$EPHEMERAL_KEY_DIR/id" >/dev/null
          EPHEMERAL_PUBKEY=$(cat "$EPHEMERAL_KEY_DIR/id.pub")

          # ── PAT temp file — never passes PAT via command-line args ────────────
          PAT_FILE=$(mktemp)
          printf '%s' "$GH_PAT" > "$PAT_FILE"
          KNOWN_HOSTS_FILE=$(mktemp)
          chmod 600 "$KNOWN_HOSTS_FILE"

          # ── Temporarily allow SSH from this runner (NSG only permits known IPs) ─
          RUNNER_IP=$(curl -sf --retry 3 https://api.ipify.org || curl -sf --retry 3 https://icanhazip.com)
          if [ -z "$RUNNER_IP" ]; then
            echo "::error::Could not determine runner public IP for NSG rule"
            exit 1
          fi
          NSG_RULE_NAME="AllowBootstrapSSH-$$-$(date +%s)"
          echo "Adding temporary NSG rule ${NSG_RULE_NAME} for runner IP ${RUNNER_IP} ..."
          az network nsg rule create \
            --resource-group "$NETWORK_RG" \
            --nsg-name "$NSG_NAME" \
            --name "$NSG_RULE_NAME" \
            --priority 999 \
            --direction Inbound \
            --access Allow \
            --protocol Tcp \
            --source-address-prefix "${RUNNER_IP}/32" \
            --destination-port-range 22 \
            --output none

          # ── Inject SSH key, grant bootstrap sudoers, capture VM host key ─────
          # Runs as root via Azure Run Command — single blocking call (~1 min).
          # Outputs the VM's ed25519 host key on stdout for strict host-key pinning.
          #
          # Retry with back-off: If the previous run-command (comin status
          # check) timed out on the client side, the VM-side extension may
          # still be executing. Azure returns HTTP 409 Conflict until it
          # finishes.  We retry up to 10 times (30 s apart ≈ 5 min window).
          echo "Injecting ephemeral SSH key and bootstrap sudoers into $VM_NAME..."
          INJECT_SCRIPT=$(printf '%s\n' \
            "mkdir -p /home/azureuser/.ssh" \
            "echo '${EPHEMERAL_PUBKEY}' >> /home/azureuser/.ssh/authorized_keys" \
            "chmod 600 /home/azureuser/.ssh/authorized_keys" \
            "chown -R azureuser:users /home/azureuser/.ssh" \
            "echo 'azureuser ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/bootstrap-temp" \
            "chmod 440 /etc/sudoers.d/bootstrap-temp" \
            "cat /etc/ssh/ssh_host_ed25519_key.pub")
          INJECT_OUT=$(mktemp)
          INJECT_ERR=$(mktemp)
          INJECT_OK=false
          for attempt in $(seq 1 10); do
            if .github/scripts/az-run-command.sh "$RG" "$VM_NAME" "$INJECT_SCRIPT" > "$INJECT_OUT" 2>"$INJECT_ERR"; then
              INJECT_OK=true
              break
            fi
            if grep -qi "Conflict\|execution is in progress" "$INJECT_ERR"; then
              echo "Run command still in progress on VM, waiting 30s (attempt $attempt/10)..."
              sleep 30
            else
              cat "$INJECT_ERR" >&2
              rm -f "$INJECT_ERR"
              exit 1
            fi
          done
          rm -f "$INJECT_ERR"
          if [ "$INJECT_OK" != "true" ]; then
            echo "::error::Failed to inject SSH key after 10 retries (run-command conflict)"
            exit 1
          fi

          # Extract VM host key and build a known_hosts file for strict verification
          HOST_KEY_DATA=$(grep '^ssh-ed25519 ' "$INJECT_OUT" | head -1 | awk '{print $1, $2}')
          rm -f "$INJECT_OUT"
          if [ -z "$HOST_KEY_DATA" ]; then
            echo "::error::Could not retrieve SSH host key from $VM_NAME"
            exit 1
          fi
          echo "${VM_IP} ${HOST_KEY_DATA}" > "$KNOWN_HOSTS_FILE"
          echo "Pinned VM SSH host key for ${VM_IP}"

          # ── Write bootstrap script to a temp file ────────────────────────────
          BOOTSTRAP_SCRIPT=$(mktemp)
          cat > "$BOOTSTRAP_SCRIPT" <<SCRIPT
          set -eo pipefail
          # NixOS /etc/profile references __ETC_PROFILE_SOURCED which is unbound
          # on first invocation; temporarily disable nounset to avoid failure.
          set +u; source /etc/profile; set -u
          mkdir -p /run/agenix
          cat /tmp/comin_pat_bootstrap > /run/agenix/comin-github-token
          chmod 600 /run/agenix/comin-github-token
          rm -f /tmp/comin_pat_bootstrap
          echo "--- bootstrap started at \$(date -Iseconds) ---"
          export NIX_CONFIG="access-tokens = github.com=\$(cat /run/agenix/comin-github-token)"
          nixos-rebuild switch --flake "github:${{ github.repository }}?dir=nixos#gw1" --show-trace 2>&1
          echo "nixos-rebuild completed successfully"
          SCRIPT

          # ── Copy PAT to VM (cleaned up by bootstrap script) ──────────────────
          scp -i "$EPHEMERAL_KEY_DIR/id" \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$PAT_FILE" "azureuser@${VM_IP}:/tmp/comin_pat_bootstrap"

          # ── Stream nixos-rebuild output via SSH (90-min timeout) ─────────────
          # BOOTSTRAP_TIMEOUT_SECONDS = 90 min: nixos-rebuild of a full NixOS
          # system takes 30-60+ min; 90 min matches the old polling loop deadline.
          BOOTSTRAP_TIMEOUT_SECONDS=5400
          echo "Starting nixos-rebuild bootstrap via SSH (output streams in real time)..."
          timeout "$BOOTSTRAP_TIMEOUT_SECONDS" ssh -i "$EPHEMERAL_KEY_DIR/id" \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o IdentitiesOnly=yes \
            "azureuser@${VM_IP}" \
            "sudo bash -s" < "$BOOTSTRAP_SCRIPT"

          rm -f "$BOOTSTRAP_SCRIPT"
          echo "✅ Comin bootstrap complete. Future config changes will be pulled automatically."
