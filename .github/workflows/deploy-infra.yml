# Azure Infrastructure Deployment
#
# Deploys plaz infrastructure to Azure using Bicep via OIDC authentication.
# Downloads the latest NixOS VHD from nixos-azimage-builder, stages it in an
# Azure Compute Gallery, and deploys the VM from the gallery image version.

name: deploy-infra

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Parameter file to use (without extension)'
        required: true
        default: 'plaz'

permissions:
  id-token: write   # Required for OIDC
  contents: read

env:
  DEPLOYMENT_LOCATION: southcentralus
  PROJECT_NAME: plaz

concurrency:
  group: infra-plaz-southcentralus
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Validate (runs on all triggers)
  # ------------------------------------------------------------------
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate main template
        run: az bicep build --file infra/main.bicep

      - name: Validate gallery template
        run: az bicep build --file infra/gallery.bicep

  # ------------------------------------------------------------------
  # Stage NixOS Image (only on push to main or manual dispatch)
  # ------------------------------------------------------------------
  stage-image:
    name: Stage NixOS Image
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      imageVersion: ${{ steps.stage.outputs.imageVersion }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Gallery Infrastructure
        run: |
          az deployment sub create \
            --location "${{ env.DEPLOYMENT_LOCATION }}" \
            --template-file infra/gallery.bicep \
            --parameters location="${{ env.DEPLOYMENT_LOCATION }}" \
                         projectName="${{ env.PROJECT_NAME }}" \
            --name "gallery-${{ env.PROJECT_NAME }}"

      - name: Stage NixOS Image Version
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          LOCATION="${{ env.DEPLOYMENT_LOCATION }}"

          # ── Gallery info from deployment outputs ──────────────────────
          GALLERY_RG=$(az deployment sub show \
            --name "gallery-${{ env.PROJECT_NAME }}" \
            --query 'properties.outputs.galleryResourceGroup.value' -o tsv)
          GALLERY_NAME=$(az deployment sub show \
            --name "gallery-${{ env.PROJECT_NAME }}" \
            --query 'properties.outputs.galleryName.value' -o tsv)
          IMAGE_DEF=$(az deployment sub show \
            --name "gallery-${{ env.PROJECT_NAME }}" \
            --query 'properties.outputs.imageDefinitionName.value' -o tsv)

          echo "Gallery RG:  $GALLERY_RG"
          echo "Gallery:     $GALLERY_NAME"
          echo "Image Def:   $IMAGE_DEF"

          # ── Latest release from nixos-azimage-builder ─────────────────
          RELEASE_JSON=$(gh api repos/poomnupong/nixos-azimage-builder/releases/latest)
          RELEASE_TAG=$(echo "$RELEASE_JSON"  | jq -r '.tag_name')
          ASSET_NAME=$(echo "$RELEASE_JSON"   | jq -r '[.assets[] | select(.name | endswith(".vhd.gz"))][0].name // ""')
          ASSET_URL=$(echo "$RELEASE_JSON"    | jq -r '[.assets[] | select(.name | endswith(".vhd.gz"))][0].browser_download_url // ""')

          if [ -z "$ASSET_NAME" ] || [ -z "$ASSET_URL" ] || [[ "$ASSET_NAME" != *.vhd.gz ]]; then
            echo "Expected a release asset ending with .vhd.gz, but none was found."
            exit 1
          fi

          # Convert tag (e.g. nixos-25.11-20260429-2017) to gallery
          # version format Major.Minor.Patch → 2511.20260429.2017
          VERSION=$(echo "$RELEASE_TAG" | sed -E 's/^nixos-([0-9]+)\.([0-9]+)-([0-9]{8})-([0-9]{4})$/\1\2.\3.\4/')

          # Validate that VERSION matches the required Major.Minor.Patch format
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tag '$RELEASE_TAG' did not convert to a valid gallery image version (got '$VERSION'). Expected format: Major.Minor.Patch"
            exit 1
          fi

          echo "Release tag: $RELEASE_TAG"
          echo "Version:     $VERSION"
          echo "Asset:       $ASSET_NAME"

          # ── Check if this version already exists ──────────────────────
          EXISTING=$(az sig image-version show \
            --resource-group "$GALLERY_RG" \
            --gallery-name "$GALLERY_NAME" \
            --gallery-image-definition "$IMAGE_DEF" \
            --gallery-image-version "$VERSION" \
            --query id -o tsv 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            echo "✅ Image version $VERSION already exists"
            echo "imageVersion=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── Download VHD ──────────────────────────────────────────────
          echo "⬇️  Downloading $ASSET_NAME …"
          curl -fSL -o "$ASSET_NAME" "$ASSET_URL"

          echo "📦 Decompressing …"
          VHD_FILE="${ASSET_NAME%.gz}"
          gunzip "$ASSET_NAME"

          VHD_SIZE=$(stat -c %s "$VHD_FILE")
          echo "VHD size: $VHD_SIZE bytes"

          # ── Create managed disk via direct upload ─────────────────────
          DISK_NAME="nixos-staging-$(echo "$RELEASE_TAG" | tr '.' '-')"
          echo "💾 Creating managed disk $DISK_NAME …"
          DISK_ID=$(az disk create \
            --resource-group "$GALLERY_RG" \
            --name "$DISK_NAME" \
            --location "$LOCATION" \
            --upload-type Upload \
            --upload-size-bytes "$VHD_SIZE" \
            --hyper-v-generation V2 \
            --os-type Linux \
            --query id -o tsv)

          echo "🔑 Getting write SAS …"
          SAS=$(az disk grant-access \
            --resource-group "$GALLERY_RG" \
            --name "$DISK_NAME" \
            --access-level Write \
            --duration-in-seconds 3600 \
            --query accessSAS -o tsv)

          echo "⬆️  Uploading VHD …"
          azcopy copy "$VHD_FILE" "$SAS" --blob-type PageBlob

          echo "🔒 Revoking disk access …"
          az disk revoke-access \
            --resource-group "$GALLERY_RG" \
            --name "$DISK_NAME"

          # ── Stamp NVMe + SCSI support on the staging disk ────────────
          # The image definition declares DiskControllerTypes but the
          # *source disk* must also carry the capability for the gallery
          # image version to inherit it (Azure requirement).
          echo "🏷️  Stamping disk controller support …"
          az rest --method PATCH \
            --url "${DISK_ID}?api-version=2024-03-02" \
            --body '{"properties":{"supportedCapabilities":{"diskControllerTypes":"SCSI, NVMe"}}}'

          # ── Create gallery image version ──────────────────────────────
          echo "🖼️  Creating image version $VERSION …"
          IMAGE_VERSION_ID=$(az sig image-version create \
            --resource-group "$GALLERY_RG" \
            --gallery-name "$GALLERY_NAME" \
            --gallery-image-definition "$IMAGE_DEF" \
            --gallery-image-version "$VERSION" \
            --location "$LOCATION" \
            --os-snapshot "$DISK_ID" \
            --query id -o tsv)

          echo "✅ Image version created: $VERSION"

          # ── Wait for replication to complete ─────────────────────────
          # az sig image-version create returns before the image is visible
          # to ARM's deployment service. Poll until replication completes.
          echo "Waiting for image version replication..."
          prov_state=""
          repl_state=""
          for i in $(seq 1 30); do
            prov_state=$(az sig image-version show \
              --resource-group "$GALLERY_RG" \
              --gallery-name "$GALLERY_NAME" \
              --gallery-image-definition "$IMAGE_DEF" \
              --gallery-image-version "$VERSION" \
              --query provisioningState -o tsv)
            repl_state=$(az sig image-version show \
              --resource-group "$GALLERY_RG" \
              --gallery-name "$GALLERY_NAME" \
              --gallery-image-definition "$IMAGE_DEF" \
              --gallery-image-version "$VERSION" \
              --expand ReplicationStatus \
              --query 'replicationStatus.aggregatedState' -o tsv 2>/dev/null || echo "Unknown")
            echo "  attempt $i: provisioningState=$prov_state aggregatedState=$repl_state"
            if [ "$prov_state" = "Succeeded" ] && [ "$repl_state" = "Completed" ]; then
              break
            elif [ "$prov_state" = "Failed" ]; then
              echo "::error::Image version replication failed"
              exit 1
            fi
            sleep 30
          done
          if [ "$prov_state" != "Succeeded" ] || [ "$repl_state" != "Completed" ]; then
            echo "::error::Image version replication timed out"
            exit 1
          fi
          echo "Image version replicated successfully"

          echo "imageVersion=$VERSION" >> "$GITHUB_OUTPUT"

          # ── Cleanup staging disk ──────────────────────────────────────
          echo "🧹 Deleting staging disk …"
          az disk delete \
            --resource-group "$GALLERY_RG" \
            --name "$DISK_NAME" \
            --yes --no-wait

  # ------------------------------------------------------------------
  # Deploy (only on push to main or manual dispatch)
  # ------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: [validate, stage-image]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve NixOS Image Version ID
        id: resolve-image
        env:
          IMAGE_VERSION: ${{ needs.stage-image.outputs.imageVersion }}
        run: |
          set -euo pipefail

          if [ -z "${IMAGE_VERSION:-}" ]; then
            echo "::error::IMAGE_VERSION is empty — stage-image may not have produced an output"
            exit 1
          fi

          GALLERY_RG="rg-${{ env.PROJECT_NAME }}-gallery-${{ env.DEPLOYMENT_LOCATION }}"
          GALLERY_NAME=$(az deployment sub show \
            --name "gallery-${{ env.PROJECT_NAME }}" \
            --query properties.outputs.galleryName.value -o tsv)
          IMAGE_DEF=$(az deployment sub show \
            --name "gallery-${{ env.PROJECT_NAME }}" \
            --query properties.outputs.imageDefinitionName.value -o tsv)

          if [ -z "${GALLERY_NAME:-}" ]; then
            echo "::error::Failed to resolve galleryName from deployment outputs for gallery-${{ env.PROJECT_NAME }}"
            exit 1
          fi

          if [ -z "${IMAGE_DEF:-}" ]; then
            echo "::error::Failed to resolve imageDefinitionName from deployment outputs for gallery-${{ env.PROJECT_NAME }}"
            exit 1
          fi
          echo "Looking up image version ${IMAGE_VERSION} …"
          IMAGE_VERSION_ID=$(az sig image-version show \
            --resource-group "$GALLERY_RG" \
            --gallery-name "$GALLERY_NAME" \
            --gallery-image-definition "$IMAGE_DEF" \
            --gallery-image-version "$IMAGE_VERSION" \
            --query id -o tsv 2>/dev/null || true)

          if [ -z "$IMAGE_VERSION_ID" ]; then
            echo "::error::Failed to resolve image version $IMAGE_VERSION — az sig image-version show returned empty"
            exit 1
          fi

          echo "Resolved image version: $IMAGE_VERSION"
          echo "NIXOS_IMAGE_ID=$IMAGE_VERSION_ID" >> "$GITHUB_ENV"

      - name: Delete VM if image changed
        run: |
          set -euo pipefail

          VM_NAME="vm-${{ env.PROJECT_NAME }}-gw1-${{ env.DEPLOYMENT_LOCATION }}"
          RG="rg-${{ env.PROJECT_NAME }}-compute-${{ env.DEPLOYMENT_LOCATION }}"

          # Query VM image reference. az vm show fails for auth/CLI errors (which
          # should stop the workflow) but also for "not found" (which is benign).
          # Capture exit code and only ignore the specific not-found case.
          VM_SHOW_OUTPUT=""
          VM_SHOW_EXIT=0
          VM_SHOW_OUTPUT=$(az vm show \
            --resource-group "$RG" \
            --name "$VM_NAME" \
            --query 'storageProfile.imageReference.id' -o tsv 2>&1) || VM_SHOW_EXIT=$?

          if [ $VM_SHOW_EXIT -ne 0 ]; then
            if echo "$VM_SHOW_OUTPUT" | grep -qi "could not be found\|ResourceNotFound"; then
              echo "VM does not exist yet -- nothing to delete."
              exit 0
            else
              echo "::error::Unexpected error querying VM: $VM_SHOW_OUTPUT"
              exit 1
            fi
          fi

          CURRENT_IMAGE="$VM_SHOW_OUTPUT"

          if [ "$CURRENT_IMAGE" = "$NIXOS_IMAGE_ID" ]; then
            echo "VM already uses the target image -- no deletion needed."
            exit 0
          fi

          echo "Image changed:"
          echo "  current: $CURRENT_IMAGE"
          echo "  target:  $NIXOS_IMAGE_ID"
          echo "Deleting VM $VM_NAME so it can be recreated with the new image..."
          az vm delete \
            --resource-group "$RG" \
            --name "$VM_NAME" \
            --force-deletion yes \
            --yes

          # Delete the old OS disk synchronously so Bicep can recreate it
          OS_DISK="osdisk-${{ env.PROJECT_NAME }}-gw1-${{ env.DEPLOYMENT_LOCATION }}"
          echo "Deleting old OS disk $OS_DISK..."
          az disk delete \
            --resource-group "$RG" \
            --name "$OS_DISK" \
            --yes

      - name: Deploy Infrastructure
        env:
          ADMIN_SSH_PUBLIC_KEY: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}
        run: |
          if ! az deployment sub create \
            --location "${{ env.DEPLOYMENT_LOCATION }}" \
            --template-file infra/main.bicep \
            --parameters infra/environments/${{ github.event.inputs.environment || 'plaz' }}.bicepparam \
            --name "deploy-${{ env.PROJECT_NAME }}"; then
            echo "::error::Bicep deployment failed. Fetching error details..."
            az deployment sub show \
              --name "deploy-${{ env.PROJECT_NAME }}" \
              --query 'properties.error' -o json || true
            az deployment operation sub list \
              --name "deploy-${{ env.PROJECT_NAME }}" \
              --query "[?properties.statusCode != 'OK'].{resource: properties.targetResource.resourceName, status: properties.statusCode, message: properties.statusMessage.error.message}" \
              -o table || true
            exit 1
          fi

      - name: Show Outputs
        run: |
          az deployment sub show \
            --name "deploy-${{ env.PROJECT_NAME }}" \
            --query properties.outputs \
            --output table

      # ── Bootstrap Comin on fresh VMs ─────────────────────────────────
      # After infra deployment, bootstrap Comin on any VM that was just
      # created (or recreated from a new image). This one-time step:
      #   1. Writes the GitHub PAT to /run/agenix/comin-github-token
      #   2. Runs nixos-rebuild switch to install Comin itself
      # After this, Comin takes over — all subsequent config changes are
      # pulled automatically from this repo.
      - name: Bootstrap Comin on gw1
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$GH_PAT"

          RG="rg-${{ env.PROJECT_NAME }}-compute-${{ env.DEPLOYMENT_LOCATION }}"
          VM_NAME="vm-${{ env.PROJECT_NAME }}-gw1-${{ env.DEPLOYMENT_LOCATION }}"

          # Check if VM exists and is running
          VM_VIEW_OUTPUT=""
          VM_VIEW_EXIT=0
          VM_VIEW_OUTPUT=$(az vm get-instance-view \
            --resource-group "$RG" \
            --name "$VM_NAME" \
            --query "instanceView.statuses[?starts_with(code, 'PowerState/')].code" \
            --output tsv 2>&1) || VM_VIEW_EXIT=$?

          if [ $VM_VIEW_EXIT -ne 0 ]; then
            if echo "$VM_VIEW_OUTPUT" | grep -qi "could not be found\|ResourceNotFound\|ResourceGroupNotFound"; then
              echo "::warning::VM does not exist yet. Skipping Comin bootstrap."
              exit 0
            else
              echo "::error::Unexpected error querying VM: $VM_VIEW_OUTPUT"
              exit 1
            fi
          fi

          POWER_STATE="$VM_VIEW_OUTPUT"
          if [ "$POWER_STATE" != "PowerState/running" ]; then
            echo "VM is not running (state: $POWER_STATE). Starting VM..."
            az vm start --resource-group "$RG" --name "$VM_NAME"
          fi

          # Bootstrap: write PAT to token file, then nixos-rebuild to install Comin.
          # After this, Comin is self-sustaining and pulls config changes automatically.
          # az vm run-command invoke always exits 0 — must parse JSON for failures.
          OUTPUT=$(az vm run-command invoke \
            --resource-group "$RG" \
            --name "$VM_NAME" \
            --command-id RunShellScript \
            --scripts $'set -euo pipefail\nsource /etc/profile\n\n# Write PAT for Comin (temporary bootstrap — agenix takes over after first rebuild)\nmkdir -p /run/agenix\necho "${GITHUB_PAT}" > /run/agenix/comin-github-token\nchmod 0400 /run/agenix/comin-github-token\n\n# First nixos-rebuild installs Comin + agenix. After this, Comin is self-sustaining.\nexport NIX_CONFIG="access-tokens = github.com=${GITHUB_PAT}"\nnixos-rebuild switch --flake "github:${{ github.repository }}?dir=nixos#gw1" --show-trace 2>&1\necho "BOOTSTRAP_SUCCESS"' \
            --parameters "GITHUB_PAT=$GH_PAT" \
            --output json)

          STDOUT=$(echo "$OUTPUT" | jq -r '.value[] | select(.code | test("StdOut")) | .message // empty')
          STDERR=$(echo "$OUTPUT" | jq -r '.value[] | select(.code | test("StdErr")) | .message // empty')
          echo "--- stdout ---"
          echo "$STDOUT"
          if [ -n "$STDERR" ]; then
            echo "--- stderr ---"
            echo "$STDERR"
          fi

          FAILED=$(echo "$OUTPUT" | jq -r '[.value[] | select(.code | test("/failed"))] | length')
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::Comin bootstrap failed (Run Command reported a failed status)."
            exit 1
          fi

          if ! echo "$STDOUT" | grep -q "BOOTSTRAP_SUCCESS"; then
            echo "::error::nixos-rebuild did not emit the success sentinel — bootstrap likely failed."
            exit 1
          fi

          echo "✅ Comin bootstrap complete. Future config changes will be pulled automatically."
