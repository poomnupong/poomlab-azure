name: min-consume

on:
  schedule:
    # Weekly Sunday 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      subscription_ids:
        description: 'Optional comma/newline-separated subscription IDs. Leave blank to auto-discover with az account list.'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

# Serialize all min-consume operations (deploy + teardown share the same group)
# so a manual dispatch cannot race with the scheduled run or with the teardown
# workflow on the same per-subscription resource group.
concurrency:
  group: min-consume
  cancel-in-progress: false

env:
  MIN_CONSUME_LOCATION: westus3
  MIN_CONSUME_RESOURCE_GROUP: rg-min-consume-westus3
  MIN_CONSUME_VNET_NAME: vnet-min-consume-westus3
  MIN_CONSUME_SUBNET_NAME: snet-min-consume
  MIN_CONSUME_NSG_NAME: nsg-min-consume-westus3
  MIN_CONSUME_PUBLIC_IP_NAME: pip-min-consume-westus3
  MIN_CONSUME_NIC_NAME: nic-min-consume-westus3
  MIN_CONSUME_VM_NAME: vm-min-consume-westus3
  MIN_CONSUME_VNET_PREFIX: 10.234.0.0/16
  MIN_CONSUME_SUBNET_PREFIX: 10.234.0.0/24
  MIN_CONSUME_VM_SIZE: Standard_B4as_v2
  # Optional override. If empty, script auto-resolves latest available Ubuntu LTS non-Pro ARM64 image.
  MIN_CONSUME_VM_IMAGE: ''
  MIN_CONSUME_ADMIN_USERNAME: azureuser
  # Optional: set CIDR (example: 203.0.113.10/32) only when SSH access is required.
  MIN_CONSUME_SSH_SOURCE: ''

jobs:
  discover:
    name: Discover subscriptions
    runs-on: ubuntu-latest
    environment: production
    outputs:
      matrix: ${{ steps.subscriptions.outputs.matrix }}
      count: ${{ steps.subscriptions.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Resolve target subscriptions
        id: subscriptions
        env:
          SUBSCRIPTION_IDS: ${{ github.event.inputs.subscription_ids || vars.MIN_CONSUME_SUBSCRIPTION_IDS || secrets.MIN_CONSUME_SUBSCRIPTION_IDS || '' }}
        run: |
          set -euo pipefail
          if [ -n "${SUBSCRIPTION_IDS:-}" ]; then
            IDS=$(printf '%s\n' "$SUBSCRIPTION_IDS" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | awk 'NF' | sort -u)
          else
            IDS=$(az account list --all --refresh --query "[?state=='Enabled'].id" -o tsv 2>/dev/null || true)
            IDS=$(printf '%s\n' "$IDS" | awk 'NF' | sort -u)
          fi

          if [ -z "$IDS" ]; then
            echo "::error::Unable to auto-discover subscriptions with \`az account list\`."
            echo "::error::Provide an explicit list via workflow_dispatch input \`subscription_ids\`"
            echo "::error::or repository variable/secret \`MIN_CONSUME_SUBSCRIPTION_IDS\`."
            exit 1
          fi

          MATRIX=$(printf '%s\n' "$IDS" | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({subscription_id: .})')
          COUNT=$(echo "$MATRIX" | jq 'length')
          # GitHub Actions caps a single job's matrix expansion at 256
          # generated jobs. Fail with a clear, actionable error before the
          # planner rejects the workflow so operators know to narrow the
          # subscription set (e.g. via `subscription_ids` / `MIN_CONSUME_SUBSCRIPTION_IDS`).
          if [ "$COUNT" -gt 256 ]; then
            echo "::error::Discovered $COUNT subscriptions, which exceeds the GitHub Actions matrix limit of 256 jobs."
            echo "::error::Restrict the set via workflow_dispatch input \`subscription_ids\` or repository variable/secret \`MIN_CONSUME_SUBSCRIPTION_IDS\`,"
            echo "::error::or split the workload across multiple workflow runs."
            exit 1
          fi
          echo "Targeting $COUNT subscription(s):"
          echo "$MATRIX" | jq -r '.[] | "  - \(.subscription_id)"'
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy minimal footprint (${{ matrix.subscription_id }})
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Deploy subscription
        env:
          SUBSCRIPTION_IDS: ${{ matrix.subscription_id }}
          MIN_CONSUME_ADMIN_SSH_PUBLIC_KEY: ${{ secrets.ADMIN_SSH_PUBLIC_KEY || '' }}
        run: |
          set -euo pipefail
          ./.github/scripts/min-consume.sh deploy
